[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "interest-growth"
version = "1.0.20"
description = "Local-first multi-interest learning, practice, research, growth and expression system with Psychology as the default Domain Pack"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.8",
  "sqlalchemy>=2.0",
  "httpx>=0.27",
  "PyYAML>=6.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Keep the pip extra and uv dependency group on the same test contract.
dev = ["pytest>=9.1.1", "pytest-asyncio>=1.4.0", "httpx2>=2,<3"]
desktop = ["pyinstaller>=6.15"]
rag-llamaindex = ["llama-index-core>=0.14,<0.15"]
rag-lightrag = ["lightrag-hku>=1.5,<1.6"]
rag-graphrag = ["graphrag>=3.1,<3.2", "nltk>=3.10.3"]
rag-pageindex = ["pageindex==0.2.12"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = [
  ".",
  "apps/api",
  "packages/domain",
  "packages/plugin-runtime",
  "packages/engine-contracts",
  "packages/event-bus",
  "packages/artifacts",
  "packages/shared",
  "packages/native-execution-core",
  "adapters/deepseek",
]

[tool.ruff]
line-length = 100

[tool.setuptools.packages.find]
where = ["packages/native-execution-core"]
include = ["interest_growth_native*"]

[tool.setuptools.package-data]
interest_growth_native = ["resources/*.sql"]

[dependency-groups]
dev = [
    "httpx2>=2,<3",
    "pyinstaller>=6.22.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
