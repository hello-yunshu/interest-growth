[package]
name = "interest-growth-desktop"
version = "1.0.7"
description = "Interest Growth desktop runtime"
authors = ["Interest Growth"]
edition = "2021"
rust-version = "1.88.0"

[lib]
name = "interest_growth_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Gate R2 §10.3 / R4 §10 layer-2 — Desktop A native broker harness for the true
# Native cross-device gate. The feature is NEVER enabled by default: the harness
# module and its FileCredentialStore are inert in every product/release build.
# Only the CI cross-device job builds the `desktop_native_harness` binary with
# this feature to run a REAL `RemoteBroker` on a headless Linux runner.
[features]
default = []
desktop-native-harness = []

# The Desktop A harness binary is `required-features`-gated: a plain `cargo
# build`/`cargo check` never produces it, so it cannot leak into release
# packaging.
[[bin]]
name = "desktop_native_harness"
path = "src/bin/desktop_native_harness.rs"
required-features = ["desktop-native-harness"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `macos-private-api` is declared in the base tauri.conf.json allowlist (app.macOSPrivateApi)
# so that the allowlist is identical on every platform and a plain `cargo check` passes on
# macOS, Linux and Windows CI hosts. On non-macOS the feature only flips a cfg flag; the
# actual private-API code inside tauri is `cfg(target_os = "macos")` gated and unused.
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
keyring = { version = "4.1", features = ["v1"] }
# keyring-core exposes the CredentialStoreApi trait + Entry used only by the
# cfg(target_os = "android") AndroidKeystoreStore. Already in the dependency tree
# via `keyring`, so this adds no new crate on desktop.
keyring-core = "1"

url = "2"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json", "multipart", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs"] }
# Gate R0.5/R0.6 — file-backed streaming. `tokio_util::io::ReaderStream`
# turns a tokio File into a bounded byte Stream for a reqwest multipart body,
# so a 100 MiB SAF upload/export is streamed from disk (a bounded app-private
# temp file) instead of being materialised as a full base64/Rust Vec copy.
# `futures_util::StreamExt` iterates the response byte stream for bounded
# download-to-file on export.
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
base64 = "0.22"

# Gate E §6.4 — on Android the OS-backed secure credential store is the Android
# Keystore (via android-native-keyring-store, which encrypts refresh credentials
# into SharedPreferences with a Keystore-held key). Declared ONLY under the
# android target so it is inert on desktop hosts and never enters the desktop
# build graph.
[target.'cfg(target_os = "android")'.dependencies]
keyring-android = { package = "android-native-keyring-store", version = "1.0" }

[dev-dependencies]
# Deterministic local broker integration tests (Gate D §P24) spin up a raw
# tokio TCP server so no public network / external service is required.
tokio = { version = "1", features = ["net", "io-util"] }
