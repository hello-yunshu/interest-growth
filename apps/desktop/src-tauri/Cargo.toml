[package]
name = "interest-growth-desktop"
version = "0.7.0"
description = "Interest Growth desktop runtime"
authors = ["Interest Growth"]
edition = "2021"
rust-version = "1.88.0"

[lib]
name = "interest_growth_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `macos-private-api` is declared in the base tauri.conf.json allowlist (app.macOSPrivateApi)
# so that the allowlist is identical on every platform and a plain `cargo check` passes on
# macOS, Linux and Windows CI hosts. On non-macOS the feature only flips a cfg flag; the
# actual private-API code inside tauri is `cfg(target_os = "macos")` gated and unused.
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
keyring = { version = "4.1", features = ["v1"] }

url = "2"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json", "multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
base64 = "0.22"

[dev-dependencies]
# Deterministic local broker integration tests (Gate D §P24) spin up a raw
# tokio TCP server so no public network / external service is required.
tokio = { version = "1", features = ["net", "io-util"] }
