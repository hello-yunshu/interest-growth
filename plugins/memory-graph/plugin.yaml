id: capability.memory-graph
name: Memory Graph
version: 0.5.0
level: 4
description: Area-scoped Growth Memory plus optional auxiliary agent memory.
default_enabled: true
requires:
  core: '>=0.1,<1.0'
  plugins:
  - core.interest-growth
provides:
  pages:
  - /growth
  capabilities:
  - memory-graph
  - memory-trace
  widgets: []
permissions:
  read:
  - growth_memory
  - auxiliary_agent_memory
  write: []
risk:
  network: true
  shell: false
  llm: false
  destructive_data: false
subscribes: []
