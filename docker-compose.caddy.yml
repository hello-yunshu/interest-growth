# Optional bundled TLS edge. The default remote profile does not require this
# file; an existing host Nginx/Caddy installation may proxy the loopback ports.

services:
  caddy:
    image: caddy:2.9-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    environment:
      SERVER_DOMAIN: ${SERVER_DOMAIN:?set SERVER_DOMAIN, e.g. ig.example.com}
    ports:
      - "${HOST_HTTP_PORT:-80}:80"
      - "${HOST_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
