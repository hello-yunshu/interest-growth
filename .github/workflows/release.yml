name: Release

# Tag-triggered formal/RC release. Re-runs the critical gates on the tag
# commit itself (never trusts "main was green"), builds + signs + verifies the
# artifacts, then publishes a GitHub Release. Any required gate failure keeps
# the release unpublished / draft (prompt §15 / §33).
#
# Android signing is fail-closed: the release APK build REQUIRES the signing
# material from GitHub secrets and FAILS if any piece is missing. A debug key
# is never substituted and a debug APK is never published as a release.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Release tag (e.g. v1.0.0-rc.1)"
        required: true
      prerelease:
        description: "Publish as prerelease"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  repo-integrity:
    name: Repository integrity gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify repository integrity
        run: bash scripts/ci/verify_repo.sh

  python-host:
    name: Python host gate (3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Host verification dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run merged Host verification
        run: python scripts/verify.py
      - name: Run full Host regression
        run: python -m pytest
      - name: Run strict Host cutover audit
        run: python scripts/audit_host_v050.py . --strict

  web:
    name: Web / ClientRuntime gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Verify Web (lint + runtime tests + build)
        run: bash scripts/ci/verify_web.sh

  rust:
    name: Rust host gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Verify Rust (check + test --locked --lib)
        run: bash scripts/ci/verify_rust.sh

  docker-integration:
    name: Docker remote-server integration
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify Docker integration (clean data volume, current commit)
        run: bash scripts/ci/verify_docker_integration.sh

  android-signed-build:
    name: Android signed release APK + static verification
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      apk-arm64: dist/android/interest-growth-android-arm64.apk
      cert-sha256: ${{ steps.signinfo.outputs.cert-sha256 }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: "Fail-closed: all release signing secrets must be present"
        env:
          KS_B64: ${{ secrets.PG_ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.PG_ANDROID_STORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.PG_ANDROID_KEY_ALIAS }}
          KS_KEY_PASS: ${{ secrets.PG_ANDROID_KEY_PASSWORD }}
        run: |
          for var in KS_B64 KS_PASS KS_ALIAS KS_KEY_PASS; do
            if [ -z "${!var}" ]; then
              echo "FAIL: release signing secret \${$var} is missing — official release build FAILS (no debug fallback)" >&2
              exit 1
            fi
          done
          mkdir -p "$RUNNER_TEMP/keystore"
          echo "${KS_B64}" | base64 -d > "$RUNNER_TEMP/keystore/release.keystore"
          chmod 600 "$RUNNER_TEMP/keystore/release.keystore"
          echo "keystore decoded to $RUNNER_TEMP/keystore/release.keystore"
      - name: Build Android toolchain image
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6
        with:
          context: .
          file: docker/android/Dockerfile
          platforms: linux/amd64
          load: true
          tags: interest-growth-android
          cache-from: type=gha,scope=android-toolchain
          cache-to: type=gha,mode=max,scope=android-toolchain
      - name: Build Web static export
        run: |
          docker run --rm --platform linux/amd64 -v "$PWD":/work -w /work \
            -e ANDROID_HOME=/opt/android-sdk \
            interest-growth-android bash -c 'cd apps/web && npm ci && NEXT_PUBLIC_API_BASE=http://localhost:8000/api npm run build'
      - name: Create Android sidecar placeholders for tauri-build
        # binaries/ is git-ignored; a clean checkout has no sidecar files.
        # tauri-build's externalBin check requires them to exist even though
        # the Android runtime is online-first (Native RemoteTransport) and
        # never launches a local core. Zero-byte placeholders satisfy the
        # build; the real PyInstaller sidecar is desktop-only.
        run: |
          mkdir -p apps/desktop/src-tauri/binaries
          for t in aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android; do
            : > "apps/desktop/src-tauri/binaries/psychology-growth-core-${t}"
          done
      - name: Build signed release APK (arm64-v8a, release signing required)
        run: |
          docker run --rm --platform linux/amd64 \
            -v "$PWD":/work -w /work \
            -v ig-gradle-cache:/root/.gradle -v ig-cargo-home:/usr/local/cargo \
            -v "$RUNNER_TEMP/keystore":/keystore:ro \
            -e ANDROID_HOME=/opt/android-sdk \
            -e ANDROID_NDK_HOME=/opt/android-sdk/ndk/27.1.12297006 \
            -e PG_ANDROID_STORE_FILE=/keystore/release.keystore \
            -e PG_ANDROID_STORE_PASSWORD="${{ secrets.PG_ANDROID_STORE_PASSWORD }}" \
            -e PG_ANDROID_KEY_ALIAS="${{ secrets.PG_ANDROID_KEY_ALIAS }}" \
            -e PG_ANDROID_KEY_PASSWORD="${{ secrets.PG_ANDROID_KEY_PASSWORD }}" \
            interest-growth-android bash -c 'cd apps/desktop && npm ci && npm run tauri -- android build --apk --target aarch64'
      - name: Build emulator x86_64 verify APK (debug, no signing secrets)
        # The emulator runs x86_64, so it installs the x86_64 debug APK (not
        # the arm64 release APK). Debug build needs no signing material.
        run: |
          docker run --rm --platform linux/amd64 \
            -v "$PWD":/work -w /work \
            -v ig-gradle-cache:/root/.gradle -v ig-cargo-home:/usr/local/cargo \
            -e ANDROID_HOME=/opt/android-sdk \
            -e ANDROID_NDK_HOME=/opt/android-sdk/ndk/27.1.12297006 \
            interest-growth-android bash -c 'cd apps/desktop && npm ci && npm run tauri -- android build --apk --target x86_64 --debug'
      - name: Stage release APK and run static verification
        id: signinfo
        run: |
          mkdir -p dist/android
          APK="$(find apps/desktop/src-tauri/gen/android/app/build/outputs/apk/universal/release -name 'app-universal-release.apk' -type f 2>/dev/null | head -1)"
          if [ -z "${APK}" ]; then echo "no release APK produced" >&2; exit 1; fi
          cp "${APK}" dist/android/interest-growth-android-arm64.apk
          # Static verification runs inside the Android toolchain so aapt2 is
          # on PATH; --require-aapt makes a missing metadata tool FAIL rather
          # than skip (Gate R2 §13.1).
          docker run --rm --platform linux/amd64 -v "$PWD":/work -w /work \
            -e ANDROID_HOME=/opt/android-sdk \
            interest-growth-android bash -c \
              'export PATH="$ANDROID_HOME/build-tools/35.0.0:$PATH"; bash scripts/ci/verify_android_apk.sh --require-aapt dist/android/interest-growth-android-arm64.apk'
          # Stage the x86_64 debug APK for the emulator job.
          X86="$(find apps/desktop/src-tauri/gen/android/app/build/outputs/apk -path '*/debug/*-debug.apk' -type f 2>/dev/null | head -1)"
          if [ -z "${X86}" ]; then echo "no x86_64 debug APK produced" >&2; exit 1; fi
          cp "${X86}" dist/android/interest-growth-android-x86_64-debug.apk
          # Verify release signature (v2) and capture the public cert fingerprint.
          docker run --rm --platform linux/amd64 -v "$PWD":/work -w /work \
            -e ANDROID_HOME=/opt/android-sdk \
            interest-growth-android bash -c \
              'export PATH="$ANDROID_HOME/build-tools/35.0.0:$PATH"; apksigner verify --verbose --print-certs /work/dist/android/interest-growth-android-arm64.apk' > "$RUNNER_TEMP/apksigner.txt"
          CERT_SHA="$(grep -E 'SHA-256' "$RUNNER_TEMP/apksigner.txt" | head -1 | sed -E 's/.*SHA-256: //' || true)"
          echo "cert-sha256=${CERT_SHA}" >> "$GITHUB_OUTPUT"
          echo "apk-sha256=$(shasum -a 256 dist/android/interest-growth-android-arm64.apk | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "--- apksigner output ---"; cat "$RUNNER_TEMP/apksigner.txt"
      - name: Generate SHA256SUMS from actual release APKs
        run: python3 scripts/ci/generate_release_checksums.py --out dist/android/SHA256SUMS.txt dist/android/interest-growth-android-arm64.apk dist/android/interest-growth-android-x86_64-debug.apk
      - name: Clean up signing material
        if: always()
        run: rm -rf "$RUNNER_TEMP/keystore"
      - name: Upload signed release APK + emulator APK + checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: interest-growth-android-artifacts
          path: |
            dist/android/interest-growth-android-arm64.apk
            dist/android/interest-growth-android-x86_64-debug.apk
            dist/android/SHA256SUMS.txt
          if-no-files-found: error

  android-emulator:
    name: Android emulator runtime gate (x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: android-signed-build
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download emulator x86_64 debug APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: interest-growth-android-artifacts
          path: dist/android
      - name: Set up JDK 17
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot self-hosted API server (docker, current commit)
        run: |
          set -euo pipefail
          # Base compose declares env_file: [.env]; a clean checkout has no .env,
          # so docker compose refuses to parse it. The api service does NOT list
          # PG_* under `environment:`, so shell-prefix vars on `compose up` are
          # never injected into the container — the remote-auth config MUST be
          # written into .env (compose's env_file), or the server boots with
          # PG_REMOTE_AUTH_ENABLED unset and the broker's fail-closed metadata
          # check refuses to connect.
          cat > .env <<'EOF'
          PG_REMOTE_AUTH_ENABLED=true
          PG_OWNER_BOOTSTRAP_TOKEN=ci-bootstrap-token-7a1f
          APP_ENV=remote
          EOF
          docker compose -p ig-emulator build api
          docker compose -p ig-emulator up -d api
          for _ in $(seq 1 60); do
            if curl -sS -o /dev/null http://127.0.0.1:8000/api/health; then
              echo "server healthy on 127.0.0.1:8000"
              exit 0
            fi
            sleep 2
          done
          echo "server failed to become healthy" >&2
          docker compose -p ig-emulator logs api >&2 || true
          exit 1
      - name: Boot emulator and run real remote vertical slice
        uses: reactivecircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a # v2.37.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          avd-name: igtest
          force-avd-creation: true
          # The runner's internal android-avd-manager installs the Android SDK
          # + system image and creates the AVD on the clean runner (no
          # ANDROID_SDK_ROOT was configured beforehand, so manual sdkmanager in
          # a separate step failed with 127 before this action even ran).
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            # This runner executes the `script:` body one LINE at a time, each
            # line in its own /usr/bin/sh (dash) subprocess — so cross-line shell
            # state (a `PKG=` variable, a multi-line `for`/`if`) never survives to
            # the following line.  Keep every line a self-contained dash command,
            # inline the package name (no variable), and fold the polling loop
            # into a single line so its loop/conditions/exit run in one sh -c.
            adb install dist/android/interest-growth-android-x86_64-debug.apk
            adb reverse tcp:18080 tcp:8000
            printf '%s\n' '{"origin": "http://127.0.0.1:18080", "ownerPassword": "Ci-Owner-Password-2026!", "bootstrapToken": "ci-bootstrap-token-7a1f", "deviceName": "android-emulator-ci"}' > /tmp/ig_e2e.json
            adb push /tmp/ig_e2e.json /data/local/tmp/ig_e2e.json
            adb shell run-as app.psychologygrowth.desktop mkdir -p files
            adb shell run-as app.psychologygrowth.desktop cp /data/local/tmp/ig_e2e.json files/ig_e2e_config.json
            adb shell run-as app.psychologygrowth.desktop chmod 600 files/ig_e2e_config.json
            adb shell am start -n app.psychologygrowth.desktop/.MainActivity
            sleep 8
            echo "--- app pid after 8s ---"; adb shell pidof app.psychologygrowth.desktop || echo "process NOT running after 8s"
            echo "--- startup logcat (grep app) ---"; adb logcat -d 2>/dev/null | grep -iE "psychologygrowth|ig-e2e|AndroidRuntime|FATAL EXCEPTION|panicked|panic at|failed to initialize|CleartextNotPermitted|isn.t allow|WebView|chromium" | tail -80 || true
            for i in $(seq 1 45); do R="$(adb shell run-as app.psychologygrowth.desktop cat files/ig_e2e_result.json 2>/dev/null || true)"; if echo "$R" | grep -q '"result": "PASS"'; then echo "emulator real remote vertical slice: PASS"; echo "$R"; exit 0; fi; if echo "$R" | grep -q '"result": "FAIL"'; then echo "emulator real remote vertical slice: FAIL"; echo "$R"; exit 1; fi; sleep 2; done; echo "FAIL: vertical slice did not complete in time"; echo "--- app pid ---"; adb shell pidof app.psychologygrowth.desktop || echo "process NOT running"; echo "--- activity top ---"; adb shell dumpsys activity activities 2>/dev/null | grep -iE "ResumedActivity|mResumedActivity|app.psychologygrowth" | head -20 || true; echo "--- app-private files dir ---"; adb shell run-as app.psychologygrowth.desktop ls -la files 2>&1 || true; echo "--- recent crash/ANR ---"; adb logcat -d -b crash 2>/dev/null | tail -60 || true; echo "--- slice/setup logcat (broad) ---"; adb logcat -d -t 3000 2>/dev/null | grep -iE "ig-e2e|AndroidRuntime|FATAL|CleartextNotPermitted|psychologygrowth|panicked|panic|Setup|setup|Keystore|Keystore|keyring|tauri|abort|Signal|signal|SIGSEGV|SIGABRT|minidump|Native crash|Ion|error" | tail -120 || true; echo "--- end diagnostics ---"; exit 1

  security-dependency:
    name: Dependency security (pip / npm / cargo)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Audit Python runtime dependencies
        run: |
          python -m pip install -e . pip-audit
          pip-audit --skip-editable
      - name: Audit optional RAG extras (documented dev-only advisory)
        # PYSEC-2026-113: pyarrow 22.0.0 is forced by graphrag~=3.1 (graphrag
        # pins pyarrow~=22.0). rag-graphrag is an optional dev/experimental
        # extra, not part of the 1.0 runtime; a fix requires an upstream
        # graphrag release that allows pyarrow>=23.0.1. Documented explicitly
        # here so the ignore is auditable, never a silent drop.
        run: |
          python -m pip install -e ".[rag-graphrag]" pip-audit
          pip-audit --skip-editable --ignore-vuln PYSEC-2026-113
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Audit production npm dependencies
        working-directory: apps/web
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - name: Install cargo-audit
        uses: taiki-e/install-action@c93ccc03e00cd0e08e494f5fd058a6c55a6a1907
        with:
          tool: cargo-audit
      - name: Audit Rust dependencies (high-confidence advisories)
        working-directory: apps/desktop/src-tauri
        run: cargo audit

  release-gate:
    name: Release aggregate gate
    runs-on: ubuntu-latest
    needs:
      - repo-integrity
      - python-host
      - web
      - rust
      - docker-integration
      - security-dependency
      - android-signed-build
      - android-emulator
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: All required gates green
        run: 'echo "release-gate: PASS (all required jobs succeeded)"'

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: release-gate
    permissions:
      contents: write
      id-token: write
      attestations: write
    environment: release
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download signed release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: interest-growth-android-artifacts
          path: dist/android
      - name: Determine tag and prerelease flag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version_tag }}"
            PRE="${{ github.event.inputs.prerelease }}"
          else
            TAG="${GITHUB_REF_NAME}"
            case "${GITHUB_REF_NAME}" in
              *-rc.*|*-beta*|*-alpha*|*-dev*) PRE=true ;;
              *) PRE=false ;;
            esac
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRE}" >> "$GITHUB_OUTPUT"
      - name: "Fail-closed: tag must resolve to the exact build SHA"
        # §16 / R0 — a formal release must never attach artifacts built from a
        # different commit than the tag. For tag pushes GITHUB_SHA is the tag
        # commit by construction; for workflow_dispatch we must validate the
        # user-supplied tag against the build SHA and fail closed on mismatch.
        run: |
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "tag push: GITHUB_SHA is the tag commit (${GITHUB_SHA}) by construction"
            exit 0
          fi
          TAG_REF="${{ steps.meta.outputs.tag }}"
          git fetch --tags --force origin
          TAG_SHA="$(git rev-list -n 1 "$TAG_REF" 2>/dev/null || true)"
          if [ -z "$TAG_SHA" ]; then
            echo "FAIL: tag ${TAG_REF} does not exist — refusing to auto-create a release tag" >&2
            exit 1
          fi
          echo "tag ${TAG_REF} resolves to ${TAG_SHA}"
          echo "build SHA is ${GITHUB_SHA}"
          if [ "$TAG_SHA" != "$GITHUB_SHA" ]; then
            echo "FAIL: tag SHA != build SHA — refusing to build A and publish it as tag B" >&2
            exit 1
          fi
      - name: "Regenerate SHA256SUMS (release assets only, never the debug APK)"
        # §16 — the x86_64 debug APK exists only as an internal emulator
        # artifact; it must never appear in the formal release checksums.
        run: python3 scripts/ci/generate_release_checksums.py --out dist/android/SHA256SUMS.txt dist/android/interest-growth-android-arm64.apk
      - name: Generate SBOM for release artifact (SPDX) — §12.4
        uses: anchore/sbom-action@62ad5284b8ced813296287a0b63906cb364b73ee
        with:
          # syft v1.x forces a `dir:` source type, which cannot resolve a
          # single file path. Scan the containing directory (the release APK
          # sits inside) so the SPDX SBOM is generated successfully (§12.4).
          path: dist/android
          format: spdx-json
          output-file: dist/android/interest-growth-android-arm64.spdx.json
          artifact-name: interest-growth-sbom
      - name: Attest build provenance for release artifact — §12.5
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: dist/android/interest-growth-android-arm64.apk
      - name: Generate release verification report
        run: |
          python3 scripts/ci/generate_release_report.py \
            --out dist/android/V1_0_RELEASE_VERIFICATION.md \
            --asset dist/android/interest-growth-android-arm64.apk \
            --field "Node=22" --field "JDK=17" --field "Android SDK=36" --field "NDK=27.1" \
            --field "Android ABI (release)=arm64-v8a" --field "Android ABI (emulator)=x86_64" \
            --test-result "repo-integrity=${{ needs.release-gate.result }}" \
            --test-result "python-host=${{ needs.release-gate.result }}" \
            --test-result "web/ClientRuntime=${{ needs.release-gate.result }}" \
            --test-result "rust=${{ needs.release-gate.result }}" \
            --test-result "docker-integration=${{ needs.release-gate.result }}" \
            --test-result "android-signed-build=${{ needs.release-gate.result }}" \
            --test-result "android-emulator=${{ needs.release-gate.result }}" \
            --not-run "physical Android device" \
            --not-run "real public internet TLS (contract verified via Docker ephemeral HTTPS in CI)" \
            --not-run "Windows code-signing certificate" \
            --not-run "macOS Developer ID / notarization credentials"
      - name: Build release body
        id: body
        run: |
          cat > "$RUNNER_TEMP/body.md" <<'EOF'
          # Interest Growth ${{ steps.meta.outputs.tag }}

          - **Commit:** ${{ github.sha }}
          - **Workflow run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          - **Supported platforms:** Android (arm64-v8a)
          - **Verification:** source integrity + Host regression + Web/ClientRuntime + Rust + Docker integration + Android signed build + APK static verification + Android emulator cold launch (see verification report asset)
          - **Signing:** release certificate SHA-256 fingerprint is reported in the verification report (non-secret)
          - **Known limitations / NOT RUN:** see `V1_0_RELEASE_VERIFICATION.md` asset
          - **Server compatibility:** v1.0.0 authenticated self-hosted Core (online-first, no offline sync)

          Checksums are in `SHA256SUMS.txt`; the verification report is `V1_0_RELEASE_VERIFICATION.md`.
          EOF
          echo "path=${RUNNER_TEMP}/body.md" >> "$GITHUB_OUTPUT"
      - name: Create release
        run: |
          gh release create "${{ steps.meta.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --title "Interest Growth ${{ steps.meta.outputs.tag }}" \
            --notes-file "${{ steps.body.outputs.path }}" \
            --prerelease="${{ steps.meta.outputs.prerelease }}" \
            dist/android/interest-growth-android-arm64.apk \
            dist/android/SHA256SUMS.txt \
            dist/android/interest-growth-android-arm64.spdx.json \
            dist/android/V1_0_RELEASE_VERIFICATION.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
