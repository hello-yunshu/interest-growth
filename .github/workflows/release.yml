        with:
          name: desktop-package-macos
          path: dist/incoming/desktop-package-macos
      - name: Download server candidate artifact
        if: needs.release-meta.outputs.is_stable == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: interest-growth-server-bundle
          path: dist/incoming/interest-growth-server-bundle
      - name: Validate formal release allowlist and checksums
        if: needs.release-meta.outputs.is_stable == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/release dist/sbom-input
          cp dist/incoming/interest-growth-android-artifacts/interest-growth-android-arm64.apk dist/release/
          find dist/incoming/desktop-package-windows -type f \( -name '*.exe' -o -name '*.msi' \) -exec cp {} dist/release/ \;
          MAC_APP="$(find dist/incoming/desktop-package-macos -type d -name 'Interest Growth.app' -print -quit)"
          if [ -n "${MAC_APP}" ]; then
            tar -czf 'dist/release/interest-growth-macos-arm64-app.tar.gz' -C "$(dirname "${MAC_APP}")" 'Interest Growth.app'
          else
            echo "FAIL: macOS Interest Growth.app missing from package artifact" >&2
            exit 1
          fi
          find dist/incoming/interest-growth-server-bundle -type f -name '*.tar.gz' -exec cp {} dist/release/ \;
          test -n "$(find dist/incoming/desktop-package-windows -type f -name '*.exe' -print -quit)" || { echo "FAIL: Windows EXE missing" >&2; exit 1; }
          test -n "$(find dist/incoming/desktop-package-windows -type f -name '*.msi' -print -quit)" || { echo "FAIL: Windows MSI missing" >&2; exit 1; }
          find dist/release -maxdepth 1 -type f -print
          for forbidden in 'x86_64' 'debug' 'release-test' '.pem' '.jks' '.keystore' 'raw-log'; do
            if find dist/release -maxdepth 1 -type f -iname "*${forbidden}*" | grep -q .; then
              echo "FAIL: forbidden release asset marker: ${forbidden}" >&2
              exit 1
            fi
          done
          test -s dist/release/interest-growth-android-arm64.apk
          test -n "$(find dist/release -maxdepth 1 -type f -name 'interest-growth-server-*.tar.gz' -print -quit)"
          python3 scripts/ci/generate_release_checksums.py --out dist/release/SHA256SUMS.txt dist/release/*
          cp dist/release/interest-growth-android-arm64.apk dist/sbom-input/
      - name: Generate candidate SBOM
        if: needs.release-meta.outputs.is_stable == 'true'
        uses: anchore/sbom-action@62ad5284b8ced813296287a0b63906cb364b73ee
        with:
          path: dist/sbom-input
          format: spdx-json
          output-file: dist/release/interest-growth-android-arm64.spdx.json
          upload-artifact: false
      - name: Candidate release asset audit passed
        if: needs.release-meta.outputs.is_stable == 'true'
        run: 'echo "RELEASE ASSET ALLOWLIST + CHECKSUM + SBOM DRY-RUN: PASS"'

  # ===========================================================================

  release-gate:
    name: Release aggregate gate
    runs-on: ubuntu-latest
    needs:
      - release-meta
      - repo-integrity
      - python-host
      - python-3-11
      - web
      - rust
      - docker-integration
      - security-dependency
      - android-signed-build
      - android-emulator
      - stable-exact-tag-extended
      - android-upgrade-in-place
      - cross-device
      - windows-package
      - macos-package
      - desktop-package-audit
      - server-bundle
      - server-bundle-deployment
      - release-asset-allowlist
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: All required gates green
        run: 'echo "release-gate: PASS (all required jobs succeeded)"'

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    if: needs.release-meta.outputs.is_candidate != 'true'
    needs:
      - release-meta
      - release-gate
      - repo-integrity
      - python-host
      - python-3-11
      - web
      - rust
      - docker-integration
      - security-dependency
      - android-signed-build
      - android-emulator
      - stable-exact-tag-extended
      - android-upgrade-in-place
      - cross-device
      - windows-package
      - macos-package
      - desktop-package-audit
      - server-bundle
      - server-bundle-deployment
      - release-asset-allowlist
    permissions:
      contents: write
      id-token: write
      attestations: write
    environment: release
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download signed release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: interest-growth-android-artifacts
          path: dist/android
      - name: Download desktop package artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: desktop-package-windows
          path: dist/windows
      - name: Download macOS package artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: desktop-package-macos
          path: dist/macos
      - name: Download server bundle artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: interest-growth-server-bundle
          path: dist/server
      - name: Determine tag and prerelease flag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version_tag }}"
            case "${{ github.event.inputs.prerelease }}" in
              true|True|TRUE|on|yes|1) PRE=true ;;
              *) PRE=false ;;
            esac
          else
            TAG="${GITHUB_REF_NAME}"
            case "${GITHUB_REF_NAME}" in
              *-rc.*|*-beta*|*-alpha*|*-dev*|*-pre*) PRE=true ;;
              *) PRE=false ;;
            esac
          fi
          if [ "$PRE" = "true" ]; then STABLE=false; else STABLE=true; fi
          {
            echo "tag=${TAG}"
            echo "prerelease=${PRE}"
            echo "is_stable=${STABLE}"
          } >> "$GITHUB_OUTPUT"
      - name: "Fail-closed: tag must resolve to the exact build SHA"
        # §16 / R0 — a formal release must never attach artifacts built from a
        # different commit than the tag. For tag pushes GITHUB_SHA is the tag
        # commit by construction; for workflow_dispatch we must validate the
        # user-supplied tag against the build SHA and fail closed on mismatch.
        run: |
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "tag push: GITHUB_SHA is the tag commit (${GITHUB_SHA}) by construction"
            exit 0
          fi
          TAG_REF="${{ steps.meta.outputs.tag }}"
          git fetch --tags --force origin
          TAG_SHA="$(git rev-list -n 1 "$TAG_REF" 2>/dev/null || true)"
          if [ -z "$TAG_SHA" ]; then
            echo "FAIL: tag ${TAG_REF} does not exist — refusing to auto-create a release tag" >&2
            exit 1
          fi
          echo "tag ${TAG_REF} resolves to ${TAG_SHA}"
          echo "build SHA is ${GITHUB_SHA}"
          if [ "$TAG_SHA" != "$GITHUB_SHA" ]; then
            echo "FAIL: tag SHA != build SHA — refusing to build A and publish it as tag B" >&2
            exit 1
          fi
      - name: "Fail-closed: Stable tag demands every Stable-only gate PASS"
        # §24 — a Stable publish is FORBIDDEN unless every mandatory Stable-only
        # gate succeeded. NOT RUN (an RC job that short-circuited) is never
        # treated as PASS for a Stable tag. Because a Stable tag forces those
        # jobs to run for real (they only short-circuit for RC), reaching here
        # with is_stable=true already implies they ran; this step re-asserts it
        # defensively so a future `needs` mistake cannot slip a Stable release
        # through without the full matrix.
        run: |
          if [ "${{ steps.meta.outputs.is_stable }}" != "true" ]; then
            echo "RC prerelease: Stable-only gates not required for this tag."
            exit 0
          fi
          for job in stable-exact-tag-extended android-upgrade-in-place cross-device windows-package macos-package desktop-package-audit; do
            case "${{ needs[format('{0}', job)].result }}" in
              success) ;;
              *) echo "FAIL: Stable-only gate ${job} is not success — Stable publish denied" >&2; exit 1 ;;
            esac
          done
          echo "all Stable-only gates PASS — Stable publish permitted"
      - name: "Package + hash release assets (never the debug APK)"
        # §16 — the x86_64 debug APK exists only as an internal emulator
        # artifact; it must never appear in the formal release checksums. All
        # formal release assets (Android APK, Windows x64 package, macOS arm64
        # package, server bundle) are hashed from the ACTUAL downloaded files.
        # The macOS .app bundle directory is archived to a single .tar.gz so it
        # can be a first-class release asset.
        run: |
          mkdir -p dist/release
          cp dist/android/interest-growth-android-arm64.apk dist/release/
          MAC_APP="$(find dist/macos -type d -name 'Interest Growth.app' -print -quit)"
          if [ -z "${MAC_APP}" ]; then
            echo "FAIL: macOS Interest Growth.app missing from package artifact" >&2
            exit 1
          fi
          tar -czf dist/release/interest-growth-macos-arm64-app.tar.gz -C "$(dirname "${MAC_APP}")" "Interest Growth.app"
          find dist/windows -type f \( -name "*.exe" -o -name "*.msi" \) -exec cp {} dist/release/ \; 2>/dev/null || true
          find dist/server -type f -name "*.tar.gz" -exec cp {} dist/release/ \; 2>/dev/null || true
          RELEASE_ASSETS=$(ls dist/release/)
          echo "release assets:"
          echo "$RELEASE_ASSETS"
          [ -n "$RELEASE_ASSETS" ] || { echo "FAIL: no release assets collected" >&2; exit 1; }
          # Single SHA256SUMS.txt over exactly the attached release files.
          python3 scripts/ci/generate_release_checksums.py --out dist/release/SHA256SUMS.txt dist/release/*
      - name: "Isolated SBOM scope (single formal release APK only) — §15"
        # syft v1.x forces a `dir:` source, so we scan an isolated directory
        # that contains ONLY the formal release APK — never the x86 debug APK
        # or checksums. This keeps the SPDX subject's digest equal to the
        # release asset.
        run: |
          rm -rf dist/sbom-input
          mkdir -p dist/sbom-input
          cp dist/release/interest-growth-android-arm64.apk dist/sbom-input/
          echo "sbom-input now contains only the formal release APK:"
          ls -la dist/sbom-input/
      - name: Generate SBOM for release artifact (SPDX) — §12.4
        uses: anchore/sbom-action@62ad5284b8ced813296287a0b63906cb364b73ee
        with:
          path: dist/sbom-input
          format: spdx-json
          output-file: dist/release/interest-growth-android-arm64.spdx.json
          artifact-name: interest-growth-sbom
      - name: Attest build provenance for release artifact — §12.5
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: dist/release/interest-growth-android-arm64.apk
      - name: Generate release verification report (per-job truthful)
        # §16 — the report records the REAL conclusion of every job, not the
        # aggregate. For an RC tag the Stable-only jobs short-circuit to
        # `success`, so we re-label them as "NOT RUN (RC)" here; a Stable tag
        # records their actual result. NOT RUN is never rendered as PASS.
        run: |
          STABLE="${{ steps.meta.outputs.is_stable }}"
          VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          REPORT="V${VERSION//./_}_RELEASE_VERIFICATION.md"
          s() { if [ "${STABLE}" = "true" ]; then echo "$1=$2"; else echo "$1=NOT RUN (RC)"; fi; }
          ST_EXTENDED="$(s "stable-exact-tag-extended" "${{ needs.stable-exact-tag-extended.result }}")"
          ST_UPGRADE="$(s "android-upgrade-in-place" "${{ needs.android-upgrade-in-place.result }}")"
          ST_CROSS="$(s "cross-device" "${{ needs.cross-device.result }}")"
          ST_WIN="$(s "windows-package" "${{ needs.windows-package.result }}")"
          ST_MAC="$(s "macos-package" "${{ needs.macos-package.result }}")"
          ST_DESK="$(s "desktop-package-audit" "${{ needs.desktop-package-audit.result }}")"
          ST_SERVER="$(s "server-bundle" "${{ needs.server-bundle.result }}")"
          ST_SERVER_DEPLOY="$(s "server-bundle-clean-deployment" "${{ needs.server-bundle-deployment.result }}")"
          ST_ASSETS="$(s "release-asset-allowlist-sbom-checksum" "${{ needs.release-asset-allowlist.result }}")"
          python3 scripts/ci/generate_release_report.py \
            --out "dist/release/${REPORT}" \
            --asset dist/release/interest-growth-android-arm64.apk \
            --field "Node=22" --field "JDK=17" --field "Android SDK=36" --field "NDK=27.1" \
            --field "Android ABI (release)=arm64-v8a" --field "Android ABI (emulator)=x86_64" \
            --field "ReleaseKind=${{ steps.meta.outputs.is_stable == 'true' && 'STABLE' || 'RC' }}" \
            --test-result "repo-integrity=${{ needs.repo-integrity.result }}" \
            --test-result "python-host(3.12)=${{ needs.python-host.result }}" \
            --test-result "python-host(3.11)=${{ needs.python-3-11.result }}" \
            --test-result "web/ClientRuntime=${{ needs.web.result }}" \
            --test-result "rust=${{ needs.rust.result }}" \
            --test-result "docker-integration=${{ needs.docker-integration.result }}" \
            --test-result "security-dependency=${{ needs.security-dependency.result }}" \
            --test-result "android-signed-build=${{ needs.android-signed-build.result }}" \
            --test-result "android-emulator=${{ needs.android-emulator.result }}" \
            --test-result "android-ui-ipc-e2e=${{ needs.android-emulator.result }}" \
            --test-result "${ST_EXTENDED}" \
            --test-result "${ST_UPGRADE}" \
            --test-result "${ST_CROSS}" \
            --test-result "${ST_WIN}" \
            --test-result "${ST_MAC}" \
            --test-result "${ST_DESK}" \
            --test-result "${ST_SERVER}" \
            --test-result "${ST_SERVER_DEPLOY}" \
            --test-result "${ST_ASSETS}" \
            --not-run "physical Android device" \
            --not-run "real public internet TLS (contract verified via Docker ephemeral HTTPS in CI)" \
            --not-run "Windows code-signing certificate (external-managed; build+smoke verified, not signed)" \
            --not-run "macOS Developer ID / notarization credentials (external-managed; build+smoke verified, not signed)"
      - name: Build release body
        id: body
        run: |
          STABLE="${{ steps.meta.outputs.is_stable }}"
          VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          REPORT="V${VERSION//./_}_RELEASE_VERIFICATION.md"
          if [ "${STABLE}" = "true" ]; then
            EXTRA="
              - **Stable gates:** exact-tag extended matrix + upgrade-in-place + cross-device + Windows x64 package + macOS arm64 package + desktop package audit + self-hosted server bundle + clean deployment + asset/SBOM/checksum audit all PASS
              - **Desktop signing:** Windows Authenticode and Apple Developer ID / notarization are NOT RUN (external-managed credentials); desktop packages are built + startup-smoked, NOT claimed as officially signed"
          else
            EXTRA="
              - **Stable-only gates:** N/A for this RC tag (Stable-only gates run on vX.Y.Z)"
          fi
          cat > "$RUNNER_TEMP/body.md" <<EOF
          # Interest Growth ${{ steps.meta.outputs.tag }}

          - **Commit:** ${{ github.sha }}
          - **Workflow run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          - **Supported platforms:** Android (arm64-v8a), Windows x64, macOS arm64$EXTRA
          - **Verification:** source integrity + Host regression (3.11 + 3.12) + Web/ClientRuntime + Rust + Docker integration + Android signed build + APK static verification + Android emulator remote slice (see verification report asset)
          - **Signing:** release certificate SHA-256 fingerprint is reported in the verification report (non-secret)
          - **Known limitations / NOT RUN:** see ${REPORT} asset
          - **Server compatibility:** v${VERSION} authenticated self-hosted Core (online-first, no offline sync)

          Checksums are in SHA256SUMS.txt per asset set; the verification report is ${REPORT}.
          EOF
          echo "path=${RUNNER_TEMP}/body.md" >> "$GITHUB_OUTPUT"
      - name: Create release
        # --verify-tag: GitHub refuses to create the release if the tag does not
        # exist at publish time (tag push / workflow_dispatch path). Combined
        # with the explicit tag→SHA fail-closed check above, a release can never
        # be created for a tag that isn't exactly the artifact build commit.
        run: |
          VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          REPORT="V${VERSION//./_}_RELEASE_VERIFICATION.md"
          gh release create "${{ steps.meta.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --title "Interest Growth ${{ steps.meta.outputs.tag }}" \
            --notes-file "${{ steps.body.outputs.path }}" \
            --prerelease="${{ steps.meta.outputs.prerelease }}" \
            --verify-tag \
            dist/release/interest-growth-android-arm64.apk \
            dist/release/SHA256SUMS.txt \
            dist/release/interest-growth-android-arm64.spdx.json \
            "dist/release/${REPORT}" \
            dist/release/interest-growth-windows-*.exe \
            dist/release/interest-growth-windows-*.msi \
            dist/release/interest-growth-macos-arm64-app.tar.gz \
            dist/release/interest-growth-server-*.tar.gz
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
