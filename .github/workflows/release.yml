name: Release

# Tag-triggered formal/RC release. Re-runs the critical gates on the tag
# commit itself (never trusts "main was green"), builds + signs + verifies the
# artifacts, then publishes a GitHub Release. Any required gate failure keeps
# the release unpublished / draft (prompt §15 / §33).
#
# Android signing is fail-closed: the release APK build REQUIRES the signing
# material from GitHub secrets and FAILS if any piece is missing. A debug key
# is never substituted and a debug APK is never published as a release.
#
# RC vs Stable (prompt §5 / V1_0_RELEASE_CRITERIA §4-§5):
#   * an RC tag (vX.Y.Z-rc.N) requires the full RC matrix (the common gates
#     below). The Stable-only gates short-circuit to a truthful "N/A for RC"
#     (they are not an RC requirement, and are NEVER reported as PASS).
#   * a Stable tag (vX.Y.Z) additionally requires the Stable-only gates:
#     upgrade-in-place, cross-device, Windows/macOS packages, desktop
#     package audit, and the exact-tag extended matrix. `publish-release`
#     FAILS CLOSED for a Stable tag unless every Stable-only gate passes.
#
# The Stable-only jobs deliberately run for BOTH tag kinds so GitHub's job
# skip-propagation never drops them from `needs`; each one short-circuits on
# the first step when the tag is an RC (no checkout, no runner cost).

on:
  workflow_call:
    inputs:
      mode:
        description: "candidate runs the full Stable matrix without publishing a Release"
        required: false
        type: string
        default: release
      candidate_sha:
        description: "Exact main SHA for Stable Candidate mode"
        required: false
        type: string
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Release tag (e.g. vX.Y.Z-rc.N)"
        required: true
      prerelease:
        description: "Publish as prerelease"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  release-meta:
    name: Resolve release metadata (tag / stable / prerelease)
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
      is_stable: ${{ steps.meta.outputs.is_stable }}
      is_candidate: ${{ steps.meta.outputs.is_candidate }}
    steps:
      - name: Resolve tag, prerelease and stable flags
        id: meta
        run: |
          IS_CANDIDATE=false
          if [ "${{ github.event_name }}" = "workflow_call" ]; then
            if [ "${{ inputs.mode }}" != "candidate" ]; then
              echo "FAIL: release.yml workflow_call is only valid for candidate mode" >&2
              exit 1
            fi
            CANDIDATE_SHA="${{ inputs.candidate_sha }}"
            if [ -z "${CANDIDATE_SHA}" ] || [ "${CANDIDATE_SHA}" != "${GITHUB_SHA}" ]; then
              echo "FAIL: candidate_sha must be non-empty and equal the caller's exact SHA" >&2
              echo "  candidate_sha=${CANDIDATE_SHA}" >&2
              echo "  GITHUB_SHA=${GITHUB_SHA}" >&2
              exit 1
            fi
            TAG="stable-candidate-${CANDIDATE_SHA}"
            PRE=false
            STABLE=true
            IS_CANDIDATE=true
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version_tag }}"
            case "${{ github.event.inputs.prerelease }}" in
              true|True|TRUE|on|yes|1) PRE=true ;;
              *) PRE=false ;;
            esac
          else
            TAG="${GITHUB_REF_NAME}"
            case "${GITHUB_REF_NAME}" in
              *-rc.*|*-beta*|*-alpha*|*-dev*|*-pre*) PRE=true ;;
              *) PRE=false ;;
            esac
          fi
          if [ "${IS_CANDIDATE}" != "true" ]; then
            if [ "$PRE" = "true" ]; then STABLE=false; else STABLE=true; fi
          fi
          {
            echo "tag=${TAG}"
            echo "is_prerelease=${PRE}"
            echo "is_stable=${STABLE}"
            echo "is_candidate=${IS_CANDIDATE}"
          } >> "$GITHUB_OUTPUT"

  repo-integrity:
    name: Repository integrity gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify repository integrity
        run: bash scripts/ci/verify_repo.sh
      - name: Verify third-party dependency versions are unchanged
        run: python3 scripts/release/verify_dependency_versions_unchanged.py --base-ref HEAD^

  python-host:
    name: Python host gate (3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Host verification dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run merged Host verification
        run: python scripts/verify.py
      - name: Run full Host regression
        run: python -m pytest
      - name: Run strict Host cutover audit
        run: python scripts/audit_host_v050.py . --strict

  python-3-11:
    name: Python host gate (3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Host verification dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run merged Host verification (3.11)
        run: python scripts/verify.py
      - name: Run full Host regression (3.11)
        run: python -m pytest
      - name: Run strict Host cutover audit (3.11)
        run: python scripts/audit_host_v050.py . --strict

  web:
    name: Web / ClientRuntime gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Verify Web (lint + runtime tests + build)
        run: bash scripts/ci/verify_web.sh

  rust:
    name: Rust host gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install Tauri Linux system dependencies
        # Bounded apt with canonical mirror pinning — the default azure
        # mirror hangs intermittently; see scripts/ci/install_tauri_system_deps.sh.
        run: bash scripts/ci/install_tauri_system_deps.sh
      - name: Verify Rust (check + test --locked --lib)
        run: bash scripts/ci/verify_rust.sh

  docker-integration:
    name: Docker remote-server integration
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify Docker integration (clean data volume, current commit)
        run: bash scripts/ci/verify_docker_integration.sh

  android-signed-build:
    name: Android signed release APK + static verification
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      apk-arm64: dist/android/interest-growth-android-arm64.apk
      apk-x86_64-release: dist/android/interest-growth-android-x86_64-release.apk
      cert-sha256: ${{ steps.signinfo.outputs.cert-sha256 }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: "Fail-closed: all release signing secrets must be present"
        env:
          KS_B64: ${{ secrets.PG_ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.PG_ANDROID_STORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.PG_ANDROID_KEY_ALIAS }}
          KS_KEY_PASS: ${{ secrets.PG_ANDROID_KEY_PASSWORD }}
        run: |
          for var in KS_B64 KS_PASS KS_ALIAS KS_KEY_PASS; do
            if [ -z "${!var}" ]; then
              echo "FAIL: release signing secret \${$var} is missing — official release build FAILS (no debug fallback)" >&2
              exit 1
            fi
          done
          mkdir -p "$RUNNER_TEMP/keystore"
          echo "${KS_B64}" | base64 -d > "$RUNNER_TEMP/keystore/release.keystore"
          chmod 600 "$RUNNER_TEMP/keystore/release.keystore"
          echo "keystore decoded to $RUNNER_TEMP/keystore/release.keystore"
      - name: Build Android toolchain image
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6
        with:
          context: .
          file: docker/android/Dockerfile
          platforms: linux/amd64
          load: true
          tags: interest-growth-android
          cache-from: type=gha,scope=android-toolchain
          cache-to: type=gha,mode=max,scope=android-toolchain
      - name: Build Web static export
        run: |
          docker run --rm --platform linux/amd64 -v "$PWD":/work -w /work \
            -e ANDROID_HOME=/opt/android-sdk \
            interest-growth-android bash -c 'cd apps/web && npm ci && NEXT_PUBLIC_API_BASE=http://localhost:8000/api npm run build'
      - name: Create Android sidecar placeholders for tauri-build
        # binaries/ is git-ignored; a clean checkout has no sidecar files.
        # tauri-build's externalBin check requires them to exist even though
        # the Android runtime is online-first (Native RemoteTransport) and
        # never launches a local core. Zero-byte placeholders satisfy the
        # build; the real PyInstaller sidecar is desktop-only.
        run: |
          mkdir -p apps/desktop/src-tauri/binaries
          for t in aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android; do
            : > "apps/desktop/src-tauri/binaries/psychology-growth-core-${t}"
          done
      - name: Build signed release APK (arm64-v8a, release signing required)
        run: |
          docker run --rm --platform linux/amd64 \
            -v "$PWD":/work -w /work \
            -v ig-gradle-cache:/root/.gradle -v ig-cargo-home:/usr/local/cargo \
            -v "$RUNNER_TEMP/keystore":/keystore:ro \
            -e ANDROID_HOME=/opt/android-sdk \
            -e ANDROID_NDK_HOME=/opt/android-sdk/ndk/27.1.12297006 \
            -e PG_RELEASE_BUILD=1 \
            -e PG_ANDROID_STORE_FILE=/keystore/release.keystore \
            -e PG_ANDROID_STORE_PASSWORD="${{ secrets.PG_ANDROID_STORE_PASSWORD }}" \
            -e PG_ANDROID_KEY_ALIAS="${{ secrets.PG_ANDROID_KEY_ALIAS }}" \
            -e PG_ANDROID_KEY_PASSWORD="${{ secrets.PG_ANDROID_KEY_PASSWORD }}" \
            interest-growth-android bash -c 'cd apps/desktop && npm ci && npm run tauri -- android build --apk --target aarch64'
      - name: Stage arm64 release APK (before x86_64 release overwrites it)
        # `tauri android build` for arm64 and x86_64 both write to the SAME
        # apk/universal/release/app-universal-release.apk path. Copy the arm64
        # release APK now so the x86_64 release build below cannot clobber the
        # official artifact.
        run: |
          mkdir -p dist/android
          mapfile -t APK_MATCHES < <(find apps/desktop/src-tauri/gen/android/app/build/outputs/apk/universal/release -name 'app-universal-release.apk' -type f 2>/dev/null | sort)
          if [ "${#APK_MATCHES[@]}" -ne 1 ]; then echo "expected exactly one arm64 release APK, found ${#APK_MATCHES[@]}" >&2; exit 1; fi
          APK="${APK_MATCHES[0]}"
          cp "${APK}" dist/android/interest-growth-android-arm64.apk
          echo "staged arm64 release APK: $(stat -f '%z' dist/android/interest-growth-android-arm64.apk 2>/dev/null || stat -c '%s' dist/android/interest-growth-android-arm64.apk) bytes"
      - name: Build CI-only signed release APK (x86_64, same cert, non-debuggable)
        # Android upgrade-in-place (Phase 4) runs on an x86_64 emulator, so the
        # "current" side of the N -> N+1 proof must be a x86_64 RELEASE APK
        # signed with the SAME production cert and non-debuggable (same
        # PG_RELEASE_BUILD=1 fail-closed signing as the arm64 release). It is
        # CI-only: uploaded as an artifact, never published as a release asset,
        # never included in the final published checksums.
        #
        # Phase 4c — black-box WebView CDP enrollment (no run-as) on this
        # throwaway APK: create a temporary CiFlags/MainActivity hook with
        # WebView debugging enabled for this build ONLY, then remove it so the release
        # artifact, the subsequent debug build and the source manifest are
        # unaffected. Enablement does NOT set android:debuggable, so the APK is
        # still non-debuggable (verify_upgrade_apk_pair.sh proves it).
        run: |
          bash scripts/ci/enable_release_test_webview.sh "$PWD"
          docker run --rm --platform linux/amd64 \
            -v "$PWD":/work -w /work \
            -v ig-gradle-cache:/root/.gradle -v ig-cargo-home:/usr/local/cargo \
            -v "$RUNNER_TEMP/keystore":/keystore:ro \
            -e ANDROID_HOME=/opt/android-sdk \
            -e ANDROID_NDK_HOME=/opt/android-sdk/ndk/27.1.12297006 \
            -e PG_RELEASE_BUILD=1 \
            -e PG_ANDROID_STORE_FILE=/keystore/release.keystore \
            -e PG_ANDROID_STORE_PASSWORD="${{ secrets.PG_ANDROID_STORE_PASSWORD }}" \
            -e PG_ANDROID_KEY_ALIAS="${{ secrets.PG_ANDROID_KEY_ALIAS }}" \
            -e PG_ANDROID_KEY_PASSWORD="${{ secrets.PG_ANDROID_KEY_PASSWORD }}" \
            interest-growth-android bash -c '
              set -euo pipefail
              cd apps/desktop
              npm ci
              F=src-tauri/gen/android/app/src/main/java/app/psychologygrowth/desktop/CiFlags.kt
              grep -q "ENABLE_WEBVIEW_REMOTE_DEBUGGING: Boolean = true" "$F" || { echo "FAIL: release-test CiFlags missing" >&2; exit 1; }
              npm run tauri -- android build --apk --target x86_64 --features android-ci-trust-root
            '
      - name: Enforce removed CI-only WebView hook before further builds
        if: always()
        # Defensive: if the x86 release-test build fails, this cleanup still
        # removes the temporary hook before any later job step can inspect it.
        run: |
          git checkout -- apps/desktop/src-tauri/gen/android/app/src/main/java/app/psychologygrowth/desktop/MainActivity.kt
          rm -f apps/desktop/src-tauri/gen/android/app/src/main/java/app/psychologygrowth/desktop/CiFlags.kt
          test ! -e apps/desktop/src-tauri/gen/android/app/src/main/java/app/psychologygrowth/desktop/CiFlags.kt
          git --no-pager diff --exit-code -- apps/desktop/src-tauri/gen/android/app/src/main/java/app/psychologygrowth/desktop/MainActivity.kt
          echo "CI-only Android source restored; production marker cannot leak"
      - name: Build emulator x86_64 verify APK (debug, no signing secrets)
        # The emulator runs x86_64, so it installs the x86_64 debug APK (not
        # the arm64 release APK). Debug build needs no signing material.
        run: |
          docker run --rm --platform linux/amd64 \
            -v "$PWD":/work -w /work \
            -v ig-gradle-cache:/root/.gradle -v ig-cargo-home:/usr/local/cargo \
            -e ANDROID_HOME=/opt/android-sdk \
            -e ANDROID_NDK_HOME=/opt/android-sdk/ndk/27.1.12297006 \
            interest-growth-android bash -c 'cd apps/desktop && npm ci && npm run tauri -- android build --apk --target x86_64 --debug'
      - name: Stage x86_64 APKs and run static verification
        id: signinfo
        run: |
          mkdir -p dist/android
          # The universal/release path now holds the x86_64 release APK (the
          # arm64 one was staged earlier, before this build overwrote it).
          mapfile -t X86REL_MATCHES < <(find apps/desktop/src-tauri/gen/android/app/build/outputs/apk/universal/release -name 'app-universal-release.apk' -type f 2>/dev/null | sort)
          if [ "${#X86REL_MATCHES[@]}" -ne 1 ]; then echo "expected exactly one x86_64 release APK, found ${#X86REL_MATCHES[@]}" >&2; exit 1; fi
          X86REL="${X86REL_MATCHES[0]}"
          cp "${X86REL}" dist/android/interest-growth-android-x86_64-release.apk
          # Stage the x86_64 debug APK for the emulator job.
          mapfile -t X86DBG_MATCHES < <(find apps/desktop/src-tauri/gen/android/app/build/outputs/apk -path '*/debug/*-debug.apk' -type f 2>/dev/null | sort)
          if [ "${#X86DBG_MATCHES[@]}" -ne 1 ]; then echo "expected exactly one x86_64 debug APK, found ${#X86DBG_MATCHES[@]}" >&2; exit 1; fi
          X86DBG="${X86DBG_MATCHES[0]}"
          cp "${X86DBG}" dist/android/interest-growth-android-x86_64-debug.apk
          # Static verification runs inside the Android toolchain so aapt2 is
          # on PATH; --require-aapt makes a missing metadata tool FAIL rather
          # than skip (Gate R2 §13.1). Both release APKs (arm64 + CI x86_64)
          # are verified; the debug APK is exercised by the emulator gate.
          docker run --rm --platform linux/amd64 -v "$PWD":/work -w /work \
            -e ANDROID_HOME=/opt/android-sdk \
            interest-growth-android bash -c \
              'export PATH="$ANDROID_HOME/build-tools/35.0.0:$PATH"; bash scripts/ci/verify_android_apk.sh --require-aapt dist/android/interest-growth-android-arm64.apk dist/android/interest-growth-android-x86_64-release.apk'
          # Verify release signatures (v2/v3) and capture the public cert
          # fingerprint for BOTH release APKs — they must share ONE cert, or
          # same-cert upgrade-in-place would be impossible (Phase 4b preflight).
          # apksigner verify accepts exactly ONE APK per invocation; loop over
          # each release APK and capture its per-APK certificate SHA-256 set.
          # V2+V3 merged signing can yield MULTIPLE 'Signer #N certificate
          # SHA-256 digest' lines per APK, so compare the whole sorted digest
          # SET per APK: the two APKs must present identical digest sets. Only
          # one shared fingerprint is exported (non-secret public cert digest).
          apksigner() { # apksigner <APK-filename> <out-file>
            docker run --rm --platform linux/amd64 -v "$PWD":/work -w /work \
              -e ANDROID_HOME=/opt/android-sdk \
              interest-growth-android bash -c \
                'export PATH="$ANDROID_HOME/build-tools/35.0.0:$PATH"; apksigner verify --verbose --print-certs "/work/dist/android/'"$1"'"' \
                > "$2" \
                || { echo "apksigner verify failed for $1" >&2; exit 1; }
          }
          apksigner interest-growth-android-arm64.apk "$RUNNER_TEMP/apk-arm64.txt"
          apksigner interest-growth-android-x86_64-release.apk "$RUNNER_TEMP/apk-x86_64.txt"
          ARM_SHA="$(grep -E 'certificate SHA-256 digest' "$RUNNER_TEMP/apk-arm64.txt" | sed -E 's/.*digest: //' | tr 'A-F' 'a-f' | sort -u)"
          X86_SHA="$(grep -E 'certificate SHA-256 digest' "$RUNNER_TEMP/apk-x86_64.txt" | sed -E 's/.*digest: //' | tr 'A-F' 'a-f' | sort -u)"
          if [ -z "${ARM_SHA}" ] || [ -z "${X86_SHA}" ]; then
            echo "FAIL: no signing cert fingerprint found (arm64='${ARM_SHA}', x86_64='${X86_SHA}')" >&2
            exit 1
          fi
          if [ "${ARM_SHA}" != "${X86_SHA}" ]; then
            echo "FAIL: arm64 and x86_64 release APKs must share ONE signing cert" >&2
            echo "  arm64  cert set: $(echo "${ARM_SHA}" | tr '\n' ' ')" >&2
            echo "  x86_64 cert set: $(echo "${X86_SHA}" | tr '\n' ' ')" >&2
            exit 1
          fi
          CERT_SHA="$(head -1 <<<"${ARM_SHA}")"
          echo "cert-sha256=${CERT_SHA}" >> "$GITHUB_OUTPUT"
          echo "apk-sha256=$(shasum -a 256 dist/android/interest-growth-android-arm64.apk | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "--- apksigner output (arm64) ---"; cat "$RUNNER_TEMP/apk-arm64.txt"
          echo "--- apksigner output (x86_64) ---"; cat "$RUNNER_TEMP/apk-x86_64.txt"
      - name: Generate SHA256SUMS from actual release APKs
        run: python3 scripts/ci/generate_release_checksums.py --out dist/android/SHA256SUMS.txt dist/android/interest-growth-android-arm64.apk dist/android/interest-growth-android-x86_64-release.apk dist/android/interest-growth-android-x86_64-debug.apk
      - name: Clean up signing material
        if: always()
        run: rm -rf "$RUNNER_TEMP/keystore"
      - name: Upload signed release APK + emulator APK + checksums
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: interest-growth-android-artifacts
          path: |
            dist/android/interest-growth-android-arm64.apk
            dist/android/interest-growth-android-x86_64-release.apk
            dist/android/interest-growth-android-x86_64-debug.apk
            dist/android/SHA256SUMS.txt
          if-no-files-found: error

  android-emulator:
    name: Android emulator runtime gate (x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: android-signed-build
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download emulator x86_64 debug APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: interest-growth-android-artifacts
          path: dist/android
      - name: Set up JDK 17
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot self-hosted API server (docker, current commit)
        run: |
          set -euo pipefail
          # Base compose declares env_file: [.env]; a clean checkout has no .env,
          # so docker compose refuses to parse it. The api service does NOT list
          # PG_* under `environment:`, so shell-prefix vars on `compose up` are
          # never injected into the container — the remote-auth config MUST be
          # written into .env (compose's env_file), or the server boots with
          # PG_REMOTE_AUTH_ENABLED unset and the broker's fail-closed metadata
          # check refuses to connect.
          cat > .env <<'EOF'
          PG_REMOTE_AUTH_ENABLED=true
          PG_OWNER_BOOTSTRAP_TOKEN=ci-bootstrap-token-7a1f
          APP_ENV=remote
          EOF
          docker compose -p ig-emulator build api
          docker compose -p ig-emulator up -d api
          for _ in $(seq 1 60); do
            if curl -sS -o /dev/null http://127.0.0.1:8000/api/health; then
              echo "server healthy on 127.0.0.1:8000"
              exit 0
            fi
            sleep 2
          done
          echo "server failed to become healthy" >&2
          docker compose -p ig-emulator logs api >&2 || true
          exit 1
      - name: Boot emulator and run real remote vertical slice
        uses: reactivecircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a # v2.37.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          avd-name: igtest
          force-avd-creation: true
          # The runner's internal android-avd-manager installs the Android SDK
          # + system image and creates the AVD on the clean runner (no
          # ANDROID_SDK_ROOT was configured beforehand, so manual sdkmanager in
          # a separate step failed with 127 before this action even ran).
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            # This runner executes the `script:` body one LINE at a time, each
            # line in its own /usr/bin/sh (dash) subprocess — so cross-line shell
            # state (a `PKG=` variable, a multi-line `for`/`if`) never survives to
            # the following line.  Keep every line a self-contained dash command,
            # inline the package name (no variable), and fold the polling loop
            # into a single line so its loop/conditions/exit run in one sh -c.
            adb install dist/android/interest-growth-android-x86_64-debug.apk
            adb reverse tcp:18080 tcp:8000
            printf '%s\n' '{"origin": "http://127.0.0.1:18080", "ownerPassword": "Ci-Owner-Password-2026!", "bootstrapToken": "ci-bootstrap-token-7a1f", "deviceName": "android-emulator-ci"}' > /tmp/ig_e2e.json
            adb push /tmp/ig_e2e.json /data/local/tmp/ig_e2e.json
            adb shell run-as app.psychologygrowth.desktop mkdir -p files
            adb shell run-as app.psychologygrowth.desktop cp /data/local/tmp/ig_e2e.json files/ig_e2e_config.json
            adb shell run-as app.psychologygrowth.desktop chmod 600 files/ig_e2e_config.json
            adb shell am start -n app.psychologygrowth.desktop/.MainActivity
            sleep 8
            echo "--- app pid after 8s ---"; adb shell pidof app.psychologygrowth.desktop || echo "process NOT running after 8s"
            echo "--- startup logcat (grep app) ---"; adb logcat -d 2>/dev/null | grep -iE "psychologygrowth|ig-e2e|AndroidRuntime|FATAL EXCEPTION|panicked|panic at|failed to initialize|CleartextNotPermitted|isn.t allow|WebView|chromium" | tail -80 || true
            for i in $(seq 1 45); do R="$(adb shell run-as app.psychologygrowth.desktop cat files/ig_e2e_result.json 2>/dev/null || true)"; if echo "$R" | grep -q '"result": "PASS"'; then echo "emulator real remote vertical slice: PASS"; echo "$R"; echo PASS > /tmp/ig_native_status; break; fi; if echo "$R" | grep -q '"result": "FAIL"'; then echo "emulator real remote vertical slice: FAIL"; echo "$R"; exit 1; fi; sleep 2; done; if [ ! -f /tmp/ig_native_status ]; then echo "FAIL: vertical slice did not complete in time"; echo "--- app pid ---"; adb shell pidof app.psychologygrowth.desktop || echo "process NOT running"; echo "--- activity top ---"; adb shell dumpsys activity activities 2>/dev/null | grep -iE "ResumedActivity|mResumedActivity|app.psychologygrowth" | head -20 || true; echo "--- app-private files dir ---"; adb shell run-as app.psychologygrowth.desktop ls -la files 2>&1 || true; echo "--- recent crash/ANR ---"; adb logcat -d -b crash 2>/dev/null | tail -60 || true; echo "--- slice/setup logcat (broad) ---"; adb logcat -d -t 3000 2>/dev/null | grep -iE "ig-e2e|AndroidRuntime|FATAL|CleartextNotPermitted|psychologygrowth|panicked|panic|Setup|setup|Keystore|keyring|tauri|abort|Signal|signal|SIGSEGV|SIGABRT|minidump|Native crash|Ion|error" | tail -120 || true; echo "--- end diagnostics ---"; exit 1; fi
            # --- UI/IPC smoke phase (§8.2) ---
            # The native slice PASSed (marker written). Now drive the REAL
            # WebView chain: Renderer -> ClientRuntime -> Tauri invoke -> Rust
            # broker -> server, recorded to files/ig_uiipc_result.json.
            adb shell run-as app.psychologygrowth.desktop rm -f files/ig_e2e_config.json
            printf '%s\n' '{"origin": "http://127.0.0.1:18080", "ownerPassword": "Ci-Owner-Password-2026!", "bootstrapToken": "ci-bootstrap-token-7a1f", "deviceName": "android-emulator-uiipc-ci"}' > /tmp/ig_uiipc.json
            adb push /tmp/ig_uiipc.json /data/local/tmp/ig_uiipc.json
            adb shell run-as app.psychologygrowth.desktop cp /data/local/tmp/ig_uiipc.json files/ig_uiipc_config.json
            adb shell run-as app.psychologygrowth.desktop chmod 600 files/ig_uiipc_config.json
            adb shell am force-stop app.psychologygrowth.desktop
            adb shell am start -n app.psychologygrowth.desktop/.MainActivity
            sleep 12
            for i in $(seq 1 60); do R="$(adb shell run-as app.psychologygrowth.desktop cat files/ig_uiipc_result.json 2>/dev/null || true)"; if echo "$R" | grep -q '"result": "PASS"'; then echo "android UI/IPC smoke: PASS"; echo "$R"; exit 0; fi; if echo "$R" | grep -q '"result": "FAIL"'; then echo "android UI/IPC smoke: FAIL"; echo "$R"; exit 1; fi; sleep 2; done; echo "FAIL: UI/IPC smoke did not complete in time"; adb shell run-as app.psychologygrowth.desktop ls -la files 2>&1 || true; echo "--- uiipc logcat ---"; adb logcat -d -t 2000 2>/dev/null | grep -iE "uiipc|ui-ipc|tauri|AndroidRuntime|FATAL|WebView|chromium|panic|error|CleartextNotPermitted" | tail -120 || true; exit 1

  security-dependency:
    name: Dependency security (pip / npm / cargo)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Audit Python runtime dependencies
        run: |
          python -m pip install -e . pip-audit
          pip-audit --skip-editable
      - name: Audit optional RAG extras (documented dev-only advisory)
        # PYSEC-2026-113: pyarrow 22.0.0 is forced by graphrag~=3.1 (graphrag
        # pins pyarrow~=22.0). The optional RAG extra pins NLTK >=3.10.0 so
        # the current NLTK advisories cannot resolve into this audit. The
        # remaining pyarrow ignore is documented explicitly and auditable.
        run: |
          python -m pip install -e ".[rag-graphrag]" pip-audit
          pip-audit --skip-editable --ignore-vuln PYSEC-2026-113
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Audit production npm dependencies
        working-directory: apps/web
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - name: Install cargo-audit
        uses: taiki-e/install-action@c93ccc03e00cd0e08e494f5fd058a6c55a6a1907
        with:
          tool: cargo-audit
      - name: Audit Rust dependencies (high-confidence advisories)
        working-directory: apps/desktop/src-tauri
        run: cargo audit

  # ===========================================================================
  # Stable-only gates. Each runs for every tag but short-circuits (first step,
  # before checkout) to a truthful "N/A for RC" when the tag is not Stable, so
  # the GitHub job-skip propagation never removes them from the aggregate gate
  # while still leaving an RC matrix cheap. For a Stable tag they are real,
  # fail-closed gates (§5 / V1_0_RELEASE_CRITERIA §5).
  # ===========================================================================

  stable-exact-tag-extended:
    name: Stable exact-tag extended matrix (native/RAG/Web-E2E/migrations)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: release-meta
    steps:
      - name: Stable-only gate — N/A for RC tag
        if: needs.release-meta.outputs.is_stable != 'true'
        run: |
          echo "stable-exact-tag-extended: N/A for RC tag (not an RC release requirement)"
          echo "Reported as NOT RUN for RC in the verification report; never PASS."
      - name: Check out source
        if: needs.release-meta.outputs.is_stable == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        if: needs.release-meta.outputs.is_stable == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Set up Node
        if: needs.release-meta.outputs.is_stable == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install Host verification dependencies
        if: needs.release-meta.outputs.is_stable == 'true'
        run: python -m pip install -e ".[dev]"
      - name: Standalone Native Core sync
        if: needs.release-meta.outputs.is_stable == 'true'
        run: python scripts/verify_native_core_sync.py
      - name: Exact RAG upstreams (shared install + verify, §9)
        if: needs.release-meta.outputs.is_stable == 'true'
        run: bash scripts/ci/verify_rag_upstreams.sh
      - name: Migration fixtures regression (exact tag)
        if: needs.release-meta.outputs.is_stable == 'true'
        run: python -m pytest tests/migrations 2>/dev/null || python -m pytest -k "migration"
      - name: Web E2E (Playwright, real Python host + Next frontend)
        if: needs.release-meta.outputs.is_stable == 'true'
        run: |
          cd apps/web && npm ci && npx playwright install chromium --with-deps && cd "$OLDPWD"
          bash scripts/ci/web_e2e_server.sh start
          cleanup() { bash scripts/ci/web_e2e_server.sh stop || true; }
          trap cleanup EXIT
          cd apps/web && npx playwright test && cd "$OLDPWD"
      - name: Report extended matrix result
        if: always() && needs.release-meta.outputs.is_stable == 'true'
        run: 'echo "stable-exact-tag-extended: done (exact tag)"'

  android-upgrade-in-place:
    name: Stable Android upgrade-in-place (same cert, N -> N+1)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    needs: [release-meta, android-signed-build]
    steps:
      - name: Stable-only gate — N/A for RC tag
        if: needs.release-meta.outputs.is_stable != 'true'
        run: |
          echo "android-upgrade-in-place: N/A for RC tag (not an RC release requirement)"
          echo "Reported as NOT RUN for RC in the verification report; never PASS."
      - name: Check out source
        if: needs.release-meta.outputs.is_stable == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: "Fail-closed: all release signing secrets must be present"
        if: needs.release-meta.outputs.is_stable == 'true'
        env:
          KS_B64: ${{ secrets.PG_ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.PG_ANDROID_STORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.PG_ANDROID_KEY_ALIAS }}
          KS_KEY_PASS: ${{ secrets.PG_ANDROID_KEY_PASSWORD }}
        run: |
          for var in KS_B64 KS_PASS KS_ALIAS KS_KEY_PASS; do
            if [ -z "${!var}" ]; then
              echo "FAIL: release signing secret \${$var} is missing — previous-tag build FAILS (no debug fallback)" >&2
              exit 1
            fi
          done
          mkdir -p "$RUNNER_TEMP/keystore"
          echo "${KS_B64}" | base64 -d > "$RUNNER_TEMP/keystore/release.keystore"
          chmod 600 "$RUNNER_TEMP/keystore/release.keystore"
          echo "keystore decoded to $RUNNER_TEMP/keystore/release.keystore"
      - name: Set up Docker Buildx
        # Needed so `docker/build-push-action --cache-to type=gha` below uses a
        # docker-container driver; the default "docker" driver cannot export the
        # gha cache and fails this toolchain build ("Cache export is not
        # supported for the docker driver"). Mirrors the android-signed-build job.
        if: needs.release-meta.outputs.is_stable == 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build Android toolchain image
        if: needs.release-meta.outputs.is_stable == 'true'
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6
        with:
          context: .
          file: docker/android/Dockerfile
          platforms: linux/amd64
          load: true
          tags: interest-growth-android
          cache-from: type=gha,scope=android-toolchain
          cache-to: type=gha,mode=max,scope=android-toolchain
      - name: Resolve previous formal stable tag (source to build 'old' from), §11
        if: needs.release-meta.outputs.is_stable == 'true'
        run: |
          set -euo pipefail
          CURRENT="${{ needs.release-meta.outputs.tag }}"
          git fetch --tags --force origin
          RELEASES_JSON="$(gh api 'repos/${{ github.repository }}/releases?per_page=100')"
          PREV="$(printf '%s' "${RELEASES_JSON}" | python3 scripts/release/resolve_upgrade_baseline.py \
            --current-tag "${CURRENT}" --config config/upgrade-baseline.toml | cut -f1)"
          if [ -z "${PREV}" ]; then echo "FAIL: no previous release tag from which to build the old upgrade APK" >&2; exit 1; fi
          git rev-parse "${PREV}^{commit}" >/dev/null
          echo "building 'old' release-test APK from published baseline: ${PREV}"
          echo "prev_tag=${PREV}" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check out previous tag source into prev_src
        if: needs.release-meta.outputs.is_stable == 'true'
        run: |
          set -euo pipefail
          git fetch --tags --force
          git worktree add -f prev_src "${prev_tag}"
          echo "prev_src ready:"; git -C prev_src describe --tags --always
      - name: Build-time transplant CI hooks into old release-test source, §11
        # The previous exact tag predates R4's WebView CDP enablement and the
        # native CI TLS trust-root injection. patch_release_test_source.sh applies
        # exactly those three committed, gated enablers (CiFlags + MainActivity
        # CDP + remote.rs trust-root). It does NOT set android:debuggable and is
        # applied ONLY to a throwaway CI-release-test APK, never the product.
        if: needs.release-meta.outputs.is_stable == 'true'
        run: bash scripts/ci/patch_release_test_source.sh prev_src
      - name: Create Android sidecar placeholders for the old tauri-build
        if: needs.release-meta.outputs.is_stable == 'true'
        run: |
          mkdir -p prev_src/apps/desktop/src-tauri/binaries
          for t in aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android; do
            : > "prev_src/apps/desktop/src-tauri/binaries/psychology-growth-core-${t}"
          done
      - name: Build old side Web static export (prev_src)
        if: needs.release-meta.outputs.is_stable == 'true'
        run: |
          docker run --rm --platform linux/amd64 -v "$PWD":/work -w /work \
            -e ANDROID_HOME=/opt/android-sdk \
            interest-growth-android bash -c 'cd prev_src/apps/web && npm ci && NEXT_PUBLIC_API_BASE=http://localhost:8000/api npm run build'
      - name: Build previous signed x86_64 RELEASE-test APK (same cert, non-debuggable), §11
        if: needs.release-meta.outputs.is_stable == 'true'
        run: |
          set -euo pipefail
          docker run --rm --platform linux/amd64 \
            -v "$PWD":/work -w /work \
            -v ig-gradle-cache:/root/.gradle -v ig-cargo-home:/usr/local/cargo \
            -v "$RUNNER_TEMP/keystore":/keystore:ro \
            -e ANDROID_HOME=/opt/android-sdk \
            -e ANDROID_NDK_HOME=/opt/android-sdk/ndk/27.1.12297006 \
            -e PG_RELEASE_BUILD=1 \
            -e PG_ANDROID_STORE_FILE=/keystore/release.keystore \
            -e PG_ANDROID_STORE_PASSWORD="${{ secrets.PG_ANDROID_STORE_PASSWORD }}" \
            -e PG_ANDROID_KEY_ALIAS="${{ secrets.PG_ANDROID_KEY_ALIAS }}" \
            -e PG_ANDROID_KEY_PASSWORD="${{ secrets.PG_ANDROID_KEY_PASSWORD }}" \
            interest-growth-android bash -c \
              'cd prev_src/apps/desktop \
               && ( cd src-tauri && { cargo metadata --locked >/dev/null 2>&1 \
                    || { echo "prev-tag lockfile unresolvable (e.g. a pinned crates.io version was never published); regenerating from manifest so genuine versions resolve"; cargo generate-lockfile; }; } ) \
               && npm ci && npm run tauri -- android build --apk --target x86_64'
          mkdir -p dist/android/prev
          mapfile -t APK_MATCHES < <(find prev_src/apps/desktop/src-tauri/gen/android/app/build/outputs/apk/universal/release -name 'app-universal-release.apk' -type f 2>/dev/null | sort)
          if [ "${#APK_MATCHES[@]}" -ne 1 ]; then echo "expected exactly one previous x86_64 RELEASE-test APK, found ${#APK_MATCHES[@]}" >&2; exit 1; fi
          APK="${APK_MATCHES[0]}"
          cp "${APK}" dist/android/prev/interest-growth-android-x86_64-release.apk
      - name: Download current signed release APKs (new side)
        if: needs.release-meta.outputs.is_stable == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: interest-growth-android-artifacts
          path: dist/android
      - name: Static upgrade-pair preflight (old vs new), §11
        # Before the emulator boots: applicationId old==new, cert SHA-256 old==new,
        # ABI old/new==x86_64, old versionCode < new, both non-debuggable. Any
        # violation fails the job (fail-closed) with a precise diagnostic.
        if: needs.release-meta.outputs.is_stable == 'true'
        run: |
          docker run --rm --platform linux/amd64 -v "$PWD":/work -w /work \
            -e ANDROID_HOME=/opt/android-sdk \
            interest-growth-android bash -c \
              'export PATH="$ANDROID_HOME/build-tools/35.0.0:$PATH"; bash scripts/ci/verify_upgrade_apk_pair.sh dist/android/prev/interest-growth-android-x86_64-release.apk dist/android/interest-growth-android-x86_64-release.apk'
      - name: Clean up signing material
        if: always()
        run: rm -rf "$RUNNER_TEMP/keystore"
      - name: Set up JDK 17
        if: needs.release-meta.outputs.is_stable == 'true'
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Enable KVM
        if: needs.release-meta.outputs.is_stable == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot self-hosted API behind a real HTTPS TLS edge (ephemeral CI CA), §11
        if: needs.release-meta.outputs.is_stable == 'true'
        run: bash scripts/ci/boot_tls_server.sh 18443 ig-upgrade
      - name: Stage ephemeral CI CA for device injection
        if: needs.release-meta.outputs.is_stable == 'true'
        run: |
          cp "$RUNNER_TEMP/ig_tls/ca.pem" dist/android/ca.pem
          test -s dist/android/ca.pem || { echo "FAIL: ephemeral CI CA not staged" >&2; exit 1; }
      - name: Emulator — real N -> N+1 upgrade (black-box CDP, non-debuggable), §11
        if: needs.release-meta.outputs.is_stable == 'true'
        uses: reactivecircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a # v2.37.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          avd-name: igupg
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            # google_apis is a userdebug image; the unprivileged shell domain
            # cannot set the arbitrary `ig.ci.*` property (SELinux property
            # context on API 34+). adb root escalates so setprop is accepted.
            adb root
            adb wait-for-device
            adb shell setprop ig.ci.tls_ca_path /data/local/tmp/ig_ca.pem
            adb push dist/android/ca.pem /data/local/tmp/ig_ca.pem
            adb shell getprop ig.ci.tls_ca_path | grep -q /data/local/tmp/ig_ca.pem || { echo "FAIL: TLS trust-root property not set" >&2; exit 1; }
            adb reverse tcp:18443 tcp:18443
            adb install -r dist/android/prev/interest-growth-android-x86_64-release.apk
            adb shell am start -n app.psychologygrowth.desktop/.MainActivity
            sleep 25
            python3 scripts/ci/android_upgrade_driver.py --stage create --origin https://127.0.0.1:18443 --owner-password 'Ci-Owner-Password-2026!' --device-name android-upgrade-ci --state-file /tmp/ig_upg_state.json --result-file /tmp/ig_upg_create.json --timeout-s 300
            echo "create stage: PASS"
            adb shell am force-stop app.psychologygrowth.desktop
            adb install -r dist/android/interest-growth-android-x86_64-release.apk
            adb shell am start -n app.psychologygrowth.desktop/.MainActivity
            sleep 30
            echo "--- new app versionName/versionCode after install -r ---"; adb shell dumpsys package app.psychologygrowth.desktop 2>/dev/null | grep -E "versionName|versionCode" | head -2 || true
            python3 scripts/ci/android_upgrade_driver.py --stage verify --origin https://127.0.0.1:18443 --owner-password 'Ci-Owner-Password-2026!' --device-name android-upgrade-ci --state-file /tmp/ig_upg_state.json --result-file /tmp/ig_upg_verify.json --timeout-s 300
            grep -q '"result": "PASS"' /tmp/ig_upg_verify.json && echo "UPGRADE_IN_PLACE = PASS" || { echo "UPGRADE_IN_PLACE = FAIL (verify result)" >&2; exit 1; }

  cross-device:
    name: Stable cross-device (desktop-remote + Android, same server)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # android-signed-build provides the x86_64 DEBUG APK (emulator_e2e is
    # compiled in via cfg(debug_assertions)); the layer-2 Native gate runs the
    # Desktop A Rust harness and the real Android emulator on ONE clean server.
    needs: [release-meta, android-signed-build]
    steps:
      - name: Stable-only gate — N/A for RC tag
        if: needs.release-meta.outputs.is_stable != 'true'
        run: |
          echo "cross-device: N/A for RC tag (not an RC release requirement)"
          echo "Reported as NOT RUN for RC in the verification report; never PASS."
      - name: Check out source
        if: needs.release-meta.outputs.is_stable == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Server multi-device canonical-state integration (§10, layer 1)
        if: needs.release-meta.outputs.is_stable == 'true'
        # Server-level canonical-state proof only (evidence level SERVER_
        # MULTI_DEVICE): two independent device sessions on one clean server
        # assert A-create -> B-read and B-create -> A-read by EXACT object ID
        # (not fuzzy substring) plus per-device revoke isolation. The real
        # Native cross-device gate (desktop-remote Rust broker + Android
        # emulator) is the layer-2 step below.
        run: |
          set -euo pipefail
          cat > .env <<'EOF'
          PG_REMOTE_AUTH_ENABLED=true
          PG_OWNER_BOOTSTRAP_TOKEN=ci-bootstrap-token-7a1f
          APP_ENV=remote
          EOF
          docker compose -p ig-cross build api
          docker compose -p ig-cross up -d api
          for _ in $(seq 1 60); do if curl -sS -o /dev/null http://127.0.0.1:8000/api/health; then break; fi; sleep 2; done
          curl -sS -f http://127.0.0.1:8000/api/health >/dev/null || { echo "server failed to become healthy" >&2; docker compose -p ig-cross logs api >&2 || true; exit 1; }
          export BASE="http://127.0.0.1:8000/api"
          export BOOTSTRAP_TOKEN="ci-bootstrap-token-7a1f"
          export OWNER_PASSWORD="Ci-Owner-Password-2026!"
          APP_VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          export APP_VERSION
          # Server instance identity is frozen; recreate can't silently shift it
          CI_SERVER_INSTANCE_ID=""
          CI_SERVER_INSTANCE_ID="$(curl -sS "${BASE}/system/capabilities" | python3 -c 'import sys,json;print(json.load(sys.stdin)["server_instance_id"])')"
          export CI_SERVER_INSTANCE_ID
          python3 - <<'PY'
          import json, os, urllib.request
          base = os.environ["BASE"]
          bt = os.environ["BOOTSTRAP_TOKEN"]
          pwd = os.environ["OWNER_PASSWORD"]
          def req(method, path, body=None, auth=None, headers=None):
              r = urllib.request.Request(base + path, method=method)
              r.add_header("Content-Type", "application/json")
              if auth: r.add_header("Authorization", "Bearer " + auth)
              for k, v in (headers or {}).items():
                  r.add_header(k, v)
              data = json.dumps(body).encode() if body is not None else None
              with urllib.request.urlopen(r, data=data) as resp:
                  return resp.status, json.loads(resp.read() or b"{}")
          req("POST", "/auth/owner/bootstrap", {"owner_password": pwd}, headers={"X-PG-Owner-Bootstrap-Token": bt})
          app_version = os.environ["APP_VERSION"]
          s1, dA = req("POST", "/auth/owner/login", {"owner_password": pwd, "device_name": "desktop-remote-A", "platform": "desktop", "app_version": app_version})
          s2, dB = req("POST", "/auth/owner/login", {"owner_password": pwd, "device_name": "android-remote-B", "platform": "android", "app_version": app_version})
          assert s1 == 201 and s2 == 201, (s1, s2)
          tokA, tokB = dA["tokens"]["access_token"], dB["tokens"]["access_token"]

          def obj_id(created):
              # The create response may return the object at top level or nested.
              return created.get("id") or created.get("question", {}).get("id")

          def find_by_id(payload, target_id, expect_question=None):
              # GET /questions returns {"questions": [...]} (exact contract).
              items = payload.get("questions") if isinstance(payload, dict) else payload
              if not isinstance(items, list):
                  raise AssertionError(f"expected 'questions' list, got {type(payload).__name__}")
              for item in items:
                  if str(item.get("id")) == str(target_id):
                      if expect_question is not None and item.get("question") != expect_question:
                          raise AssertionError(
                              f"id {target_id} matched but question differs: "
                              f"{item.get('question')!r} != {expect_question!r}"
                          )
                      return True
              return False

          # A creates canonical data -> B reads it by EXACT id.
          s, created = req("POST", "/questions", {"question": "desktop-A authored"}, auth=tokA)
          assert s in (200, 201), s
          qidA = obj_id(created)
          assert qidA is not None, f"POST /questions returned no id: {created}"
          s, rB = req("GET", "/questions", auth=tokB)
          assert s == 200, s
          assert find_by_id(rB, qidA, "desktop-A authored"), "B cannot read A data by id"
          # B creates canonical data -> A reads it by EXACT id.
          s, createdB = req("POST", "/questions", {"question": "android-B authored"}, auth=tokB)
          assert s in (200, 201), s
          qidB = obj_id(createdB)
          assert qidB is not None, f"POST /questions returned no id: {createdB}"
          s, rA = req("GET", "/questions", auth=tokA)
          assert s == 200, s
          assert find_by_id(rA, qidB, "android-B authored"), "A cannot read B data by id"
          # device list sees both
          s, devs = req("GET", "/auth/devices", {}, auth=tokA)
          assert s == 200 and len(devs["devices"]) >= 2, (s, devs)
          # A revokes B -> B's next request fails, A unaffected
          s, _ = req("POST", "/auth/device/revoke", {"device_id": dB["device"]["id"], "owner_password": pwd}, auth=tokA)
          assert s == 200, s
          try:
              req("GET", "/dashboard", auth=tokB); raise SystemExit("B still valid after revoke")
          except Exception:
              pass
          s, _ = req("GET", "/dashboard", auth=tokA)
          assert s == 200, "A affected by B revoke"
          print("server multi-device: A->B and B->A exact-id reads verified; revoke isolation PASS")
          PY
          docker compose -p ig-cross down -v --remove-orphans

      # =========================================================================
      # Layer 2 — true Native cross-device gate (prompt §10 layer-2). ONE clean
      # Docker server; Desktop A is a REAL native desktop-remote broker (the
      # desktop_native_harness binary, NOT a raw HTTP client) and Android B is a
      # REAL Android emulator running the native android-remote broker
      # (emulator_e2e.rs, compiled into the x86_64 DEBUG APK). Evidence levels:
      # DESKTOP_NATIVE_BROKER + ANDROID_EMULATOR_NATIVE_BROKER + CROSS_DEVICE.
      # =========================================================================
      - name: Download emulator x86_64 debug APK
        if: needs.release-meta.outputs.is_stable == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: interest-growth-android-artifacts
          path: dist/android
      - name: Set up JDK 17
        if: needs.release-meta.outputs.is_stable == 'true'
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Enable KVM
        if: needs.release-meta.outputs.is_stable == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Set up Rust
        if: needs.release-meta.outputs.is_stable == 'true'
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - name: Install Tauri Linux system dependencies
        if: needs.release-meta.outputs.is_stable == 'true'
        # Bounded apt with canonical mirror pinning — the default azure
        # mirror hangs intermittently; see scripts/ci/install_tauri_system_deps.sh.
        run: bash scripts/ci/install_tauri_system_deps.sh
      - name: Build Desktop A native harness binary (§10, layer 2)
        if: needs.release-meta.outputs.is_stable == 'true'
        run: |
          set -euo pipefail
          cd apps/desktop/src-tauri
          # tauri-build validates every externalBin file; a placeholder satisfies
          # the build (the real PyInstaller sidecar is built per target).
          mkdir -p binaries
          : > binaries/psychology-growth-core-x86_64-unknown-linux-gnu
          cargo build --locked --bin desktop_native_harness --features desktop-native-harness
          ls -la target/debug/desktop_native_harness
      - name: Boot server for Native cross-device gate (§10, layer 2)
        if: needs.release-meta.outputs.is_stable == 'true'
        run: |
          set -euo pipefail
          # Same env_file requirement as the other jobs (see android-emulator
          # comment): the remote-auth config MUST live in .env, not shell env.
          cat > .env <<'EOF'
          PG_REMOTE_AUTH_ENABLED=true
          PG_OWNER_BOOTSTRAP_TOKEN=ci-bootstrap-token-7a1f
          APP_ENV=remote
          EOF
          docker compose -p ig-cross-native build api
          docker compose -p ig-cross-native up -d api
          for _ in $(seq 1 60); do if curl -sS -o /dev/null http://127.0.0.1:8000/api/health; then break; fi; sleep 2; done
          curl -sS -f http://127.0.0.1:8000/api/health >/dev/null || { echo "server failed to become healthy" >&2; docker compose -p ig-cross-native logs api >&2 || true; exit 1; }
          echo "server healthy on 127.0.0.1:8000 (project ig-cross-native, clean volume)"
      - name: Prepare Desktop A harness + Android B slice configs (§10, layer 2)
        if: needs.release-meta.outputs.is_stable == 'true'
        run: |
          set -euo pipefail
          mkdir -p /tmp/ig_harness
          cp apps/desktop/src-tauri/target/debug/desktop_native_harness /tmp/ig_harness/desktop_native_harness
          # Desktop A phase a_create: real probe -> bootstrap -> login/enroll ->
          # create A's marker. Enrollment + refresh credential persist under the
          # default appDataDir/storeFile so b_revoke reuses A's session.
          cat > /tmp/ig_harness/a_create.json <<'JSON'
          {
            "phase": "a_create",
            "origin": "http://127.0.0.1:8000",
            "ownerPassword": "Ci-Owner-Password-2026!",
            "bootstrapToken": "ci-bootstrap-token-7a1f",
            "deviceName": "desktop-native-A",
            "createMarker": "desktop-native-A authored"
          }
          JSON
          # Desktop A phase b_revoke: B->A exact read, device list A+B, revoke B,
          # A unaffected, server records B revoked.
          cat > /tmp/ig_harness/b_revoke.json <<'JSON'
          {
            "phase": "b_revoke",
            "origin": "http://127.0.0.1:8000",
            "ownerPassword": "Ci-Owner-Password-2026!",
            "bootstrapToken": "ci-bootstrap-token-7a1f",
            "deviceName": "desktop-native-A",
            "expectBQuestion": "android-emulator-B authored",
            "expectBDeviceName": "android-emulator-cross-b"
          }
          JSON
          # Android B slice 1 (emulator app launch): enroll + keepDevice + exact
          # A->B read of A's marker + B creates its own marker + stays active.
          cat > /tmp/ig_harness/b_slice1.json <<'JSON'
          {
            "origin": "http://127.0.0.1:18080",
            "ownerPassword": "Ci-Owner-Password-2026!",
            "bootstrapToken": "ci-bootstrap-token-7a1f",
            "deviceName": "android-emulator-cross-b",
            "expectAQuestion": "desktop-native-A authored",
            "createMarker": "android-emulator-B authored",
            "keepDevice": true
          }
          JSON
          # Android B slice 2 (second app launch, after A revoked B): the stored
          # credential is DENIED on an authenticated mutation, then B re-enrolls
          # (recovery) and re-reads A's marker.
          cat > /tmp/ig_harness/b_slice2.json <<'JSON'
          {
            "origin": "http://127.0.0.1:18080",
            "ownerPassword": "Ci-Owner-Password-2026!",
            "bootstrapToken": "ci-bootstrap-token-7a1f",
            "deviceName": "android-emulator-cross-b",
            "expectAQuestion": "desktop-native-A authored",
            "expectRevoked": true
          }
          JSON
          echo "configs written:"; ls -la /tmp/ig_harness
      - name: Desktop A — phase a_create (native desktop-remote broker)
        if: needs.release-meta.outputs.is_stable == 'true'
        run: |
          set -euo pipefail
          OUT="$(/tmp/ig_harness/desktop_native_harness --config /tmp/ig_harness/a_create.json)"
          printf '%s\n' "$OUT"
          printf '%s' "$OUT" | grep -q 'HARNESS RESULT=PASS' || { echo "Desktop A a_create did not report PASS" >&2; exit 1; }
          echo "Desktop A a_create: PASS"
      - name: Boot Android emulator — B slices + A revoke orchestration (§10, layer 2)
        if: needs.release-meta.outputs.is_stable == 'true'
        uses: reactivecircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a # v2.37.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          avd-name: igtest
          force-avd-creation: true
          # Same emulator flags as the android-emulator job (headless CI).
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # The orchestrator script runs on the HOST (adb on PATH) and drives:
          #   B slice 1 (enroll + A->B exact read + keepDevice)
          #   Desktop A b_revoke (host binary, same server)
          #   B slice 2 (expectRevoked + recovery cross-read)
          script: bash ${{ github.workspace }}/scripts/ci/cross_device_emulator_slices.sh
        env:
          IG_HARNESS_BIN: /tmp/ig_harness/desktop_native_harness
          IG_B_REVOKE_CFG: /tmp/ig_harness/b_revoke.json
          IG_B_SLICE1_CFG: /tmp/ig_harness/b_slice1.json
          IG_B_SLICE2_CFG: /tmp/ig_harness/b_slice2.json
          IG_APK: ${{ github.workspace }}/dist/android/interest-growth-android-x86_64-debug.apk
          IG_PKG: app.psychologygrowth.desktop
      - name: Teardown Native cross-device server
        if: always() && needs.release-meta.outputs.is_stable == 'true'
        run: docker compose -p ig-cross-native down -v --remove-orphans

  windows-package:
    name: Stable Windows x64 package build + startup smoke
    runs-on: windows-latest
    timeout-minutes: 90
    needs: release-meta
    steps:
      - name: Stable-only gate — N/A for RC tag
        if: needs.release-meta.outputs.is_stable != 'true'
        run: |
          echo "windows-package: N/A for RC tag (not an RC release requirement)"
          echo "Reported as NOT RUN for RC in the verification report; never PASS."
      - name: Check out source
        if: needs.release-meta.outputs.is_stable == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        if: needs.release-meta.outputs.is_stable == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up Node
        if: needs.release-meta.outputs.is_stable == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Set up Rust (x86_64-pc-windows-msvc)
        if: needs.release-meta.outputs.is_stable == 'true'
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - name: Install Host deps + PyInstaller
        if: needs.release-meta.outputs.is_stable == 'true'
        run: |
          python -m pip install -e . pyinstaller
      - name: Install web and desktop npm dependencies
        if: needs.release-meta.outputs.is_stable == 'true'
        run: |
          npm --prefix apps/web ci
          npm --prefix apps/desktop ci
      - name: Build x64 sidecar + web + desktop package
        if: needs.release-meta.outputs.is_stable == 'true'
        shell: bash
        run: |
          python scripts/build_desktop_sidecar.py --target x86_64-pc-windows-msvc
          npm --prefix apps/web run build
          npm --prefix apps/desktop run tauri -- build --target x86_64-pc-windows-msvc
      - name: Packaged desktop-local x64 startup smoke
        if: needs.release-meta.outputs.is_stable == 'true'
        shell: bash
        run: |
          # Deterministic resolver (§7): reads the Cargo [package].name and
          # returns the exact main binary (interest-growth-desktop.exe). It
          # rejects build-script-* / sidecar / helpers and FAILS on ambiguity
          # instead of masking ambiguity with a first-match fallback.
          APP_BIN="$(python scripts/ci/resolve_desktop_app_binary.py --triple x86_64-pc-windows-msvc)"
          bash scripts/ci/verify_packaged_startup.sh "${APP_BIN}" --win
      - name: Upload Windows package artifact
        if: always() && needs.release-meta.outputs.is_stable == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-package-windows
          path: |
            apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          if-no-files-found: warn

