name: Release

# Formal publication is tag-push only. The reusable gate implementation lives
# in _release-gates.yml and receives an explicit mode, so Stable/RC semantics
# never depend on guessing the caller event or a manual prerelease boolean.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release-gates:
    uses: ./.github/workflows/_release-gates.yml
    with:
      mode: release
    secrets: inherit
