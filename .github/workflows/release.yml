name: Release

# Formal publication is tag-push or explicitly requested tag dispatch. The reusable gate implementation is
# read-only and produces the canonical asset staging artifact; only this
# caller-side job receives publication and provenance permissions.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Exact existing release tag to publish"
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  release-gates:
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/_release-gates.yml
    with:
      mode: release
      release_tag: ${{ inputs.release_tag }}
    secrets: inherit

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    if: needs.release-gates.result == 'success'
    needs: release-gates
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
    environment: release
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Download canonical release asset staging
        uses: actions/download-artifact@v4 # v4
        with:
          name: formal-release-assets
          path: dist/release

      - name: Verify downloaded canonical assets against SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/release/SHA256SUMS.txt
          (
            cd dist/release
            sha256sum -c SHA256SUMS.txt
          )
          echo "CANONICAL RELEASE ASSET CHECKSUM SELF-VERIFICATION: PASS"

      - name: Resolve tag and release kind
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ inputs.release_tag }}"
          if [ -z "${TAG}" ]; then TAG="${GITHUB_REF_NAME}"; fi
          if [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            PRE=false
          elif [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-(rc\.[0-9]+|beta\.[0-9]+|alpha\.[0-9]+|dev\.[0-9]+|pre\.[0-9]+)$ ]]; then
            PRE=true
          else
            echo "FAIL: tag '${TAG}' is not a supported Stable or prerelease tag" >&2
            exit 1
          fi
          STABLE=$([ "${PRE}" = "true" ] && echo false || echo true)
          {
            echo "tag=${TAG}"
            echo "prerelease=${PRE}"
            echo "is_stable=${STABLE}"
          } >> "${GITHUB_OUTPUT}"

      - name: "Fail-closed: tag version must match source version"
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/verify_release_identity.py --tag "${{ steps.meta.outputs.tag }}"

      - name: "Fail-closed: tag must resolve to the exact build SHA"
        id: tag-proof
        shell: bash
        run: |
          set -euo pipefail
          TAG_SHA="$(git rev-list -n 1 "${{ steps.meta.outputs.tag }}" 2>/dev/null || true)"
          test -n "${TAG_SHA}" || { echo "FAIL: pushed tag cannot be resolved" >&2; exit 1; }
          CHECKOUT_SHA="$(git rev-parse HEAD)"
          test "${TAG_SHA}" = "${CHECKOUT_SHA}" || {
            echo "FAIL: tag SHA ${TAG_SHA} != checked-out SHA ${CHECKOUT_SHA}" >&2
            exit 1
          }
          echo "tag ${TAG_SHA} and checked-out SHA ${CHECKOUT_SHA} are identical"
          echo "tag_sha=${TAG_SHA}" >> "${GITHUB_OUTPUT}"

      - name: "Fail-closed: Stable tag requires exact-SHA successful Candidate"
        id: candidate-proof
        if: steps.meta.outputs.is_stable == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.tag-proof.outputs.tag_sha }}
        shell: bash
        run: |
          set -euo pipefail
          # --slurp makes paginated gh output one JSON value. The flattening
          # below remains correct for the single-page case as well.
          RUNS_FILE="$(mktemp)"
          trap 'rm -f "${RUNS_FILE}"' EXIT
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/workflows/stable-candidate.yml/runs?event=workflow_dispatch&per_page=100" > "${RUNS_FILE}"
          CANDIDATE_PROOF="$(TARGET_SHA="${TARGET_SHA}" GITHUB_SERVER_URL="${GITHUB_SERVER_URL}" GITHUB_REPOSITORY="${GITHUB_REPOSITORY}" python3 - "${RUNS_FILE}" <<'PY'
          import json
          import os
          import sys

          target = os.environ["TARGET_SHA"]
          with open(sys.argv[1], encoding="utf-8") as handle:
              pages = json.load(handle)
          if isinstance(pages, dict):
              pages = [pages]
          matches = [
              run
              for page in pages
              for run in page.get("workflow_runs", [])
              if run.get("head_sha") == target
              and run.get("status") == "completed"
              and run.get("conclusion") == "success"
          ]
          if not matches:
              raise SystemExit("FAIL: Stable tag lacks exact-SHA successful Stable Candidate")
          candidate = max(matches, key=lambda item: item.get('run_number', 0))
          run_id = candidate.get("id")
          candidate_sha = candidate.get("head_sha")
          run_url = candidate.get("html_url") or (
              f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}"
              f"/actions/runs/{run_id}"
          )
          if not run_id or not candidate_sha:
              raise SystemExit("FAIL: exact Stable Candidate result lacks identity fields")
          print(f"candidate_run_id={run_id}")
          print(f"candidate_sha={candidate_sha}")
          print(f"candidate_url={run_url}")
          print("candidate_conclusion=success")
          PY
          )"
          printf '%s\n' "${CANDIDATE_PROOF}" | tee -a "${GITHUB_OUTPUT}"

      - name: Finalize release verification report with caller identity
        env:
          CANDIDATE_SHA: ${{ steps.candidate-proof.outputs.candidate_sha }}
          CANDIDATE_RUN_ID: ${{ steps.candidate-proof.outputs.candidate_run_id }}
          CANDIDATE_RUN_URL: ${{ steps.candidate-proof.outputs.candidate_url }}
          CANDIDATE_CONCLUSION: ${{ steps.candidate-proof.outputs.candidate_conclusion }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          REPORT="dist/release/V${VERSION//./_}_RELEASE_VERIFICATION.md"
          TAG="${{ steps.meta.outputs.tag }}"
          TAG_SHA="${{ steps.tag-proof.outputs.tag_sha }}"
          if [ "${{ steps.meta.outputs.is_stable }}" = "true" ]; then
            test -n "${CANDIDATE_SHA}"
            test -n "${CANDIDATE_RUN_ID}"
            test -n "${CANDIDATE_RUN_URL}"
            test "${CANDIDATE_CONCLUSION}" = "success"
          else
            CANDIDATE_SHA="NOT APPLICABLE"
            CANDIDATE_RUN_ID="NOT APPLICABLE"
            CANDIDATE_RUN_URL="NOT APPLICABLE"
            CANDIDATE_CONCLUSION="NOT APPLICABLE"
          fi
          python3 scripts/ci/finalize_release_report.py \
            --report "${REPORT}" \
            --candidate-sha "${CANDIDATE_SHA}" \
            --candidate-run-id "${CANDIDATE_RUN_ID}" \
            --candidate-run-url "${CANDIDATE_RUN_URL}" \
            --candidate-conclusion "${CANDIDATE_CONCLUSION}" \
            --tag "${TAG}" \
            --tag-sha "${TAG_SHA}" \
            --release-run-id "${GITHUB_RUN_ID}" \
            --release-run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Regenerate final release checksums
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' FINAL_ASSETS < <(
            find dist/release -maxdepth 1 -type f \
              ! -name 'SHA256SUMS.txt' -print0 | sort -z
          )
          test "${#FINAL_ASSETS[@]}" -gt 0
          python3 scripts/ci/generate_release_checksums.py \
            --out dist/release/SHA256SUMS.txt "${FINAL_ASSETS[@]}"

      - name: Verify final canonical assets against SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          (
            cd dist/release
            sha256sum -c SHA256SUMS.txt
          )
          echo "FINAL CANONICAL RELEASE ASSET CHECKSUM SELF-VERIFICATION: PASS"

      - name: Verify canonical formal asset contract
        shell: bash
        run: |
          set -euo pipefail
          REPORT="dist/release/V$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"].replace(".", "_"))')_RELEASE_VERIFICATION.md"
          assets=(
            "dist/release/interest-growth-android-arm64.apk"
            "dist/release/SHA256SUMS.txt"
            "dist/release/interest-growth-android-arm64.spdx.json"
            "${REPORT}"
          )
          if [ "${{ steps.meta.outputs.is_stable }}" = "true" ]; then
            assets+=("dist/release/interest-growth-windows-x64-installer.exe")
            if [ -f dist/release/interest-growth-windows-x64.msi ]; then
              assets+=("dist/release/interest-growth-windows-x64.msi")
            fi
            assets+=("dist/release/interest-growth-macos-arm64-app.tar.gz")
            mapfile -t server_assets < <(find dist/release -maxdepth 1 -type f -name 'interest-growth-server-*.tar.gz' | sort)
            test "${#server_assets[@]}" -eq 1 || { echo "FAIL: expected one server bundle" >&2; exit 1; }
            assets+=("${server_assets[0]}")
          fi
          for asset in "${assets[@]}"; do
            test -s "${asset}" || { echo "FAIL: missing formal release asset ${asset}" >&2; exit 1; }
          done
          printf '%s\n' "${assets[@]}"

      - name: Attest Android arm64 provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/release/interest-growth-android-arm64.apk

      - name: Build release body
        id: body
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          REPORT="V${VERSION//./_}_RELEASE_VERIFICATION.md"
          TAG_SHA="${{ steps.tag-proof.outputs.tag_sha }}"
          if [ "${{ steps.meta.outputs.is_stable }}" = "true" ]; then
            EXTRA="
          - **Stable gates:** exact-SHA Candidate + exact-tag full matrix + canonical asset audit PASS
          - **Desktop signing:** Windows Authenticode and Apple Developer ID / notarization are NOT RUN (external-managed credentials)"
          else
            EXTRA="
          - **Stable-only gates:** NOT RUN for this RC tag"
          fi
          cat > "${RUNNER_TEMP}/body.md" <<EOF
          # Interest Growth ${{ steps.meta.outputs.tag }}

          - **Commit:** ${TAG_SHA}
          - **Workflow run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          - **Verification:** reusable release gates + canonical asset staging + checksums + SBOM + provenance$EXTRA
          - **Known limitations / NOT RUN:** see ${REPORT} asset

          Checksums are in SHA256SUMS.txt; the verification report is ${REPORT}.
          EOF
          echo "path=${RUNNER_TEMP}/body.md" >> "${GITHUB_OUTPUT}"

      - name: Create release with explicit asset array
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          REPORT="dist/release/V$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"].replace(".", "_"))')_RELEASE_VERIFICATION.md"
          assets=(
            "dist/release/interest-growth-android-arm64.apk"
            "dist/release/SHA256SUMS.txt"
            "dist/release/interest-growth-android-arm64.spdx.json"
            "${REPORT}"
          )
          if [ "${{ steps.meta.outputs.is_stable }}" = "true" ]; then
            assets+=("dist/release/interest-growth-windows-x64-installer.exe")
            if [ -f dist/release/interest-growth-windows-x64.msi ]; then
              assets+=("dist/release/interest-growth-windows-x64.msi")
            fi
            assets+=("dist/release/interest-growth-macos-arm64-app.tar.gz")
            mapfile -t server_assets < <(find dist/release -maxdepth 1 -type f -name 'interest-growth-server-*.tar.gz' | sort)
            test "${#server_assets[@]}" -eq 1
            assets+=("${server_assets[0]}")
          fi
          for asset in "${assets[@]}"; do
            test -s "${asset}"
          done
          gh release create "${{ steps.meta.outputs.tag }}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Interest Growth ${{ steps.meta.outputs.tag }}" \
            --notes-file "${{ steps.body.outputs.path }}" \
            --prerelease="${{ steps.meta.outputs.prerelease }}" \
            --verify-tag \
            "${assets[@]}"
