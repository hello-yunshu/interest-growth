name: Release

# Tag-triggered formal/RC release. Re-runs the critical gates on the tag
# commit itself (never trusts "main was green"), builds + signs + verifies the
# artifacts, then publishes a GitHub Release. Any required gate failure keeps
# the release unpublished / draft (prompt §15 / §33).
#
# Android signing is fail-closed: the release APK build REQUIRES the signing
# material from GitHub secrets and FAILS if any piece is missing. A debug key
# is never substituted and a debug APK is never published as a release.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Release tag (e.g. v0.7.0-rc.1)"
        required: true
      prerelease:
        description: "Publish as prerelease"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  repo-integrity:
    name: Repository integrity gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify repository integrity
        run: bash scripts/ci/verify_repo.sh

  python-host:
    name: Python host gate (3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Host verification dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run merged Host verification
        run: python scripts/verify.py
      - name: Run full Host regression
        run: python -m pytest
      - name: Run strict Host cutover audit
        run: python scripts/audit_host_v050.py . --strict

  web:
    name: Web / ClientRuntime gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Verify Web (lint + runtime tests + build)
        run: bash scripts/ci/verify_web.sh

  rust:
    name: Rust host gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Verify Rust (check + test --locked --lib)
        run: bash scripts/ci/verify_rust.sh

  docker-integration:
    name: Docker remote-server integration
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify Docker integration (clean data volume, current commit)
        run: bash scripts/ci/verify_docker_integration.sh

  android-signed-build:
    name: Android signed release APK + static verification
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      apk-arm64: dist/android/interest-growth-android-arm64.apk
      cert-sha256: ${{ steps.signinfo.outputs.cert-sha256 }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca5145bd269ebc9623c8f9158bf2ad01e613dc # v3
      - name: "Fail-closed: all release signing secrets must be present"
        env:
          KS_B64: ${{ secrets.PG_ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.PG_ANDROID_STORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.PG_ANDROID_KEY_ALIAS }}
          KS_KEY_PASS: ${{ secrets.PG_ANDROID_KEY_PASSWORD }}
        run: |
          for var in KS_B64 KS_PASS KS_ALIAS KS_KEY_PASS; do
            if [ -z "${!var}" ]; then
              echo "FAIL: release signing secret \${$var} is missing — official release build FAILS (no debug fallback)" >&2
              exit 1
            fi
          done
          mkdir -p "$RUNNER_TEMP/keystore"
          echo "${KS_B64}" | base64 -d > "$RUNNER_TEMP/keystore/release.keystore"
          chmod 600 "$RUNNER_TEMP/keystore/release.keystore"
          echo "keystore decoded to $RUNNER_TEMP/keystore/release.keystore"
      - name: Build Android toolchain image
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6
        with:
          context: .
          file: docker/android/Dockerfile
          platforms: linux/amd64
          load: true
          tags: interest-growth-android
          cache-from: type=gha,scope=android-toolchain
          cache-to: type=gha,mode=max,scope=android-toolchain
      - name: Build Web static export
        run: |
          docker run --rm --platform linux/amd64 -v "$PWD":/work -w /work \
            -e ANDROID_HOME=/opt/android-sdk \
            interest-growth-android bash -c 'cd apps/web && npm ci && NEXT_PUBLIC_API_BASE=http://localhost:8000/api npm run build'
      - name: Build signed release APK (arm64-v8a, release signing required)
        run: |
          docker run --rm --platform linux/amd64 \
            -v "$PWD":/work -w /work \
            -v ig-gradle-cache:/root/.gradle -v ig-cargo-home:/usr/local/cargo \
            -v "$RUNNER_TEMP/keystore":/keystore:ro \
            -e ANDROID_HOME=/opt/android-sdk \
            -e ANDROID_NDK_HOME=/opt/android-sdk/ndk/27.1.12297006 \
            -e PG_ANDROID_STORE_FILE=/keystore/release.keystore \
            -e PG_ANDROID_STORE_PASSWORD="${{ secrets.PG_ANDROID_STORE_PASSWORD }}" \
            -e PG_ANDROID_KEY_ALIAS="${{ secrets.PG_ANDROID_KEY_ALIAS }}" \
            -e PG_ANDROID_KEY_PASSWORD="${{ secrets.PG_ANDROID_KEY_PASSWORD }}" \
            interest-growth-android bash -c 'cd apps/desktop && npx tauri android build --apk --target aarch64'
      - name: Build emulator x86_64 verify APK (debug, no signing secrets)
        # The emulator runs x86_64, so it installs the x86_64 debug APK (not
        # the arm64 release APK). Debug build needs no signing material.
        run: |
          docker run --rm --platform linux/amd64 \
            -v "$PWD":/work -w /work \
            -v ig-gradle-cache:/root/.gradle -v ig-cargo-home:/usr/local/cargo \
            -e ANDROID_HOME=/opt/android-sdk \
            -e ANDROID_NDK_HOME=/opt/android-sdk/ndk/27.1.12297006 \
            interest-growth-android bash -c 'cd apps/desktop && npx tauri android build --apk --target x86_64 --debug'
      - name: Stage release APK and run static verification
        id: signinfo
        run: |
          mkdir -p dist/android
          APK="$(find apps/desktop/src-tauri/gen/android/app/build/outputs/apk/universal/release -name 'app-universal-release.apk' -type f 2>/dev/null | head -1)"
          if [ -z "${APK}" ]; then echo "no release APK produced" >&2; exit 1; fi
          cp "${APK}" dist/android/interest-growth-android-arm64.apk
          bash scripts/ci/verify_android_apk.sh dist/android/interest-growth-android-arm64.apk
          # Stage the x86_64 debug APK for the emulator job.
          X86="$(find apps/desktop/src-tauri/gen/android/app/build/outputs/apk -path '*/debug/*-debug.apk' -type f 2>/dev/null | head -1)"
          if [ -z "${X86}" ]; then echo "no x86_64 debug APK produced" >&2; exit 1; fi
          cp "${X86}" dist/android/interest-growth-android-x86_64-debug.apk
          # Verify release signature (v2) and capture the public cert fingerprint.
          docker run --rm --platform linux/amd64 -v "$PWD":/work -w /work \
            -e ANDROID_HOME=/opt/android-sdk \
            interest-growth-android bash -c \
              'apksigner verify --verbose --print-certs /work/dist/android/interest-growth-android-arm64.apk' > "$RUNNER_TEMP/apksigner.txt"
          CERT_SHA="$(grep -E 'SHA-256' "$RUNNER_TEMP/apksigner.txt" | head -1 | sed -E 's/.*SHA-256: //' || true)"
          echo "cert-sha256=${CERT_SHA}" >> "$GITHUB_OUTPUT"
          echo "apk-sha256=$(shasum -a 256 dist/android/interest-growth-android-arm64.apk | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "--- apksigner output ---"; cat "$RUNNER_TEMP/apksigner.txt"
      - name: Generate SHA256SUMS from actual release APKs
        run: python3 scripts/ci/generate_release_checksums.py --out dist/android/SHA256SUMS.txt dist/android/interest-growth-android-arm64.apk dist/android/interest-growth-android-x86_64-debug.apk
      - name: Clean up signing material
        if: always()
        run: rm -rf "$RUNNER_TEMP/keystore"
      - name: Upload signed release APK + emulator APK + checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: interest-growth-android-artifacts
          path: |
            dist/android/interest-growth-android-arm64.apk
            dist/android/interest-growth-android-x86_64-debug.apk
            dist/android/SHA256SUMS.txt
          if-no-files-found: error

  android-emulator:
    name: Android emulator runtime gate (x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: android-signed-build
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download emulator x86_64 debug APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: interest-growth-android-artifacts
          path: dist/android
      - name: Set up JDK 17
        uses: actions/setup-java@2e5b3051ff9e70c6eeb4ea1d0f3c0eae77f8e0a4 # v5.0.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install emulator system image + create AVD
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "system-images;android-35;google_apis;x86_64" "platform-tools" "emulator" >/dev/null
          echo "no" | avdmanager create avd -n igtest -k "system-images;android-35;google_apis;x86_64" --force
      - name: Boot emulator and cold-launch smoke
        uses: reactivecircus/android-emulator-runner@cad321644df6d8cf1985a42767272ff068adb9cb # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          avd-name: igtest
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb install dist/android/interest-growth-android-x86_64-debug.apk
            adb shell am start -n app.psychologygrowth.desktop/.MainActivity
            sleep 20
            adb shell pidof app.psychologygrowth.desktop || (echo "FAIL: main process not running" && exit 1)
            adb shell "dumpsys activity activities | grep -i mainactivity | head -3"
            echo "emulator cold-launch smoke: PASS"

  release-gate:
    name: Release aggregate gate
    runs-on: ubuntu-latest
    needs:
      - repo-integrity
      - python-host
      - web
      - rust
      - docker-integration
      - android-signed-build
      - android-emulator
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: All required gates green
        run: 'echo "release-gate: PASS (all required jobs succeeded)"'

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: release-gate
    permissions:
      contents: write
    environment: release
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download signed release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: interest-growth-android-artifacts
          path: dist/android
      - name: Determine tag and prerelease flag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version_tag }}"
            PRE="${{ github.event.inputs.prerelease }}"
          else
            TAG="${GITHUB_REF_NAME}"
            case "${GITHUB_REF_NAME}" in
              *-rc.*|*-beta*|*-alpha*|*-dev*) PRE=true ;;
              *) PRE=false ;;
            esac
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRE}" >> "$GITHUB_OUTPUT"
      - name: Regenerate SHA256SUMS from actual release files
        run: python3 scripts/ci/generate_release_checksums.py --out dist/android/SHA256SUMS.txt dist/android/interest-growth-android-arm64.apk dist/android/interest-growth-android-x86_64-debug.apk
      - name: Generate release verification report
        run: |
          python3 scripts/ci/generate_release_report.py \
            --out dist/android/V0_7_RELEASE_VERIFICATION.md \
            --asset dist/android/interest-growth-android-arm64.apk \
            --asset dist/android/interest-growth-android-x86_64-debug.apk \
            --field "Node=22" --field "JDK=17" --field "Android SDK=36" --field "NDK=27.1" \
            --field "Android ABI (release)=arm64-v8a" --field "Android ABI (emulator)=x86_64" \
            --test-result "repo-integrity=${{ needs.release-gate.result }}" \
            --test-result "python-host=${{ needs.release-gate.result }}" \
            --test-result "web/ClientRuntime=${{ needs.release-gate.result }}" \
            --test-result "rust=${{ needs.release-gate.result }}" \
            --test-result "docker-integration=${{ needs.release-gate.result }}" \
            --test-result "android-signed-build=${{ needs.release-gate.result }}" \
            --test-result "android-emulator=${{ needs.release-gate.result }}" \
            --not-run "physical Android device" \
            --not-run "real public internet TLS (contract verified via Docker ephemeral HTTPS in CI)" \
            --not-run "Windows code-signing certificate" \
            --not-run "macOS Developer ID / notarization credentials"
      - name: Build release body
        id: body
        run: |
          cat > "$RUNNER_TEMP/body.md" <<'EOF'
          # Interest Growth v0.7

          - **Commit:** ${{ github.sha }}
          - **Workflow run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          - **Supported platforms:** Android (arm64-v8a)
          - **Verification:** source integrity + Host regression + Web/ClientRuntime + Rust + Docker integration + Android signed build + APK static verification + Android emulator cold launch (see verification report asset)
          - **Signing:** release certificate SHA-256 fingerprint is reported in the verification report (non-secret)
          - **Known limitations / NOT RUN:** see `V0_7_RELEASE_VERIFICATION.md` asset
          - **Server compatibility:** v0.7 authenticated self-hosted Core (online-first, no offline sync)

          Checksums are in `SHA256SUMS.txt`; the verification report is `V0_7_RELEASE_VERIFICATION.md`.
          EOF
          echo "path=${RUNNER_TEMP}/body.md" >> "$GITHUB_OUTPUT"
      - name: Create release
        run: |
          gh release create "${{ steps.meta.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --title "Interest Growth ${{ steps.meta.outputs.tag }}" \
            --notes-file "${{ steps.body.outputs.path }}" \
            --prerelease="${{ steps.meta.outputs.prerelease }}" \
            dist/android/interest-growth-android-arm64.apk \
            dist/android/interest-growth-android-x86_64-debug.apk \
            dist/android/SHA256SUMS.txt \
            dist/android/V0_7_RELEASE_VERIFICATION.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
