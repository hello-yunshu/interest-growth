          python scripts/build_desktop_sidecar.py --target aarch64-apple-darwin
          npm --prefix apps/web run build
          # --bundles app: DMG is NOT a release asset and its bundling is
          # flaky on headless CI runners; the gate needs only the packaged
          # .app for the startup smoke (macOS is never a signed release asset).
          npm --prefix apps/desktop run tauri -- build --target aarch64-apple-darwin --bundles app
      - name: Packaged desktop-local arm64 startup smoke
        if: needs.release-meta.outputs.is_stable == 'true'
        run: |
          # Deterministic resolver (§8): resolves the exact bundle executable
          # (Interest Growth.app/Contents/MacOS/interest-growth-desktop), never
          # an ambiguous first-match fallback onto the psychology-growth-core sidecar.
          APP_BIN="$(python3 scripts/ci/resolve_desktop_app_binary.py --triple aarch64-apple-darwin)"
          bash scripts/ci/verify_packaged_startup.sh "${APP_BIN}" --mac
      - name: Upload macOS package artifact
        if: always() && needs.release-meta.outputs.is_stable == 'true'
        uses: actions/upload-artifact@v4 # v4
        with:
          name: desktop-package-macos
          path: apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/**/*
          if-no-files-found: warn

  desktop-package-audit:
    name: Stable desktop package artifact audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [release-meta, windows-package, macos-package]
    steps:
      - name: Stable-only gate — N/A for RC tag
        if: needs.release-meta.outputs.is_stable != 'true'
        run: |
          echo "desktop-package-audit: N/A for RC tag (not an RC release requirement)"
          echo "Reported as NOT RUN for RC in the verification report; never PASS."
      - name: Collect + audit desktop package artifacts
        if: needs.release-meta.outputs.is_stable == 'true'
        run: |
          echo "platform packaging results:"
          echo "  windows-package: ${{ needs.windows-package.result }}"
          echo "  macos-package:   ${{ needs.macos-package.result }}"
          echo "-------"
          echo "Desktop signing limitation (honest, never faked): official Windows Authenticode and Apple Developer ID / notarization are NOT RUN (external-managed credentials). Desktop packages are built + startup-smoked; they are NOT claimed as officially signed."
          echo "desktop-package-audit: PASS (per-platform build includes packaged startup smoke)"

  server-bundle:
    name: Build self-hosted server bundle (tar.gz)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: release-meta
    steps:
      - name: Stable-only gate — N/A for RC tag
        if: needs.release-meta.outputs.is_stable != 'true'
        run: |
          echo "server-bundle: N/A for RC tag (not an RC release requirement)"
          echo "Reported as NOT RUN for RC in the verification report; never PASS."
      - name: Check out source
        if: needs.release-meta.outputs.is_stable == 'true'
        uses: actions/checkout@v7.0.1 # v7.0.1
      - name: Verify server source integrity
        if: needs.release-meta.outputs.is_stable == 'true'
        run: |
          python3 scripts/generate_source_manifest.py --check
      - name: Assemble deterministic server bundle
        if: needs.release-meta.outputs.is_stable == 'true'
        run: |
          VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          mkdir -p dist/release/server
          python3 scripts/release/build_server_bundle.py \
            --version "${VERSION}" \
            --source-sha "${GITHUB_SHA}" \
            --out "dist/release/server/interest-growth-server-${VERSION}.tar.gz"
          echo "bundle:"
          ls -la dist/release/server/
      - name: Upload server bundle artifact
        if: always() && needs.release-meta.outputs.is_stable == 'true'
        uses: actions/upload-artifact@v4 # v4
        with:
          name: interest-growth-server-bundle
          path: dist/release/server/*
          if-no-files-found: error

  server-bundle-deployment:
    name: Stable server bundle clean-extract deployment
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [release-meta, server-bundle]
    steps:
      - name: Stable-only gate — N/A for RC tag
        if: needs.release-meta.outputs.is_stable != 'true'
        run: |
          echo "server-bundle-deployment: N/A for RC tag"
          echo "Reported as NOT RUN for the RC; never PASS."
      - name: Check out verification script
        if: needs.release-meta.outputs.is_stable == 'true'
        uses: actions/checkout@v7.0.1 # v7.0.1
      - name: Download server bundle
        if: needs.release-meta.outputs.is_stable == 'true'
        uses: actions/download-artifact@v4 # v4
        with:
          name: interest-growth-server-bundle
          path: dist/server
      - name: Extract and deploy bundle from an empty directory
        if: needs.release-meta.outputs.is_stable == 'true'
        run: |
          ARCHIVE="$(find dist/server -type f -name 'interest-growth-server-*.tar.gz' -print -quit)"
          test -n "${ARCHIVE}" || { echo "FAIL: server bundle archive missing" >&2; exit 1; }
          bash scripts/ci/verify_clean_server_bundle.sh "${ARCHIVE}"

  release-asset-allowlist:
    name: Canonical release asset staging, allowlist and SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - release-meta
      - repo-integrity
      - python-host
      - python-3-11
      - web
      - rust
      - docker-integration
      - security-dependency
      - android-signed-build
      - android-emulator
      - stable-exact-tag-extended
      - android-upgrade-in-place
      - cross-device
      - windows-package
      - macos-package
      - desktop-package-audit
      - server-bundle
      - server-bundle-deployment
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1 # v7.0.1
      - name: Download candidate artifacts
        uses: actions/download-artifact@v4 # v4
        with:
          name: interest-growth-android-artifacts
          path: dist/incoming/interest-growth-android-artifacts
      - name: Download Windows candidate artifact
        if: needs.release-meta.outputs.is_stable == 'true'
        uses: actions/download-artifact@v4 # v4
        with:
          name: desktop-package-windows
          path: dist/incoming/desktop-package-windows
      - name: Download macOS candidate artifact
        if: needs.release-meta.outputs.is_stable == 'true'
        uses: actions/download-artifact@v4 # v4
        with:
          name: desktop-package-macos
          path: dist/incoming/desktop-package-macos
      - name: Download server candidate artifact
        if: needs.release-meta.outputs.is_stable == 'true'
        uses: actions/download-artifact@v4 # v4
        with:
          name: interest-growth-server-bundle
          path: dist/incoming/interest-growth-server-bundle
      - name: Validate formal release allowlist and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/release dist/sbom-input
          cp dist/incoming/interest-growth-android-artifacts/interest-growth-android-arm64.apk dist/release/
          if [ "${{ needs.release-meta.outputs.is_stable }}" = "true" ]; then
            mapfile -t EXES < <(find dist/incoming/desktop-package-windows -type f -name '*.exe' | sort)
            test "${#EXES[@]}" -eq 1 || {
              echo "FAIL: expected exactly one Windows NSIS EXE, found ${#EXES[@]}" >&2
              exit 1
            }
            cp "${EXES[0]}" dist/release/interest-growth-windows-x64-installer.exe

            mapfile -t MSIS < <(find dist/incoming/desktop-package-windows -type f -name '*.msi' | sort)
            if [ "${#MSIS[@]}" -gt 1 ]; then
              echo "FAIL: expected zero or one Windows MSI, found ${#MSIS[@]}" >&2
              exit 1
            elif [ "${#MSIS[@]}" -eq 1 ]; then
              cp "${MSIS[0]}" dist/release/interest-growth-windows-x64.msi
            fi

            mapfile -t MAC_APPS < <(find dist/incoming/desktop-package-macos -type d -name 'Interest Growth.app' | sort)
            test "${#MAC_APPS[@]}" -eq 1 || {
              echo "FAIL: expected exactly one macOS Interest Growth.app, found ${#MAC_APPS[@]}" >&2
              exit 1
            }
            MAC_APP="${MAC_APPS[0]}"
            tar -czf 'dist/release/interest-growth-macos-arm64-app.tar.gz' -C "$(dirname "${MAC_APP}")" 'Interest Growth.app'

            mapfile -t SERVER_ASSETS < <(find dist/incoming/interest-growth-server-bundle -maxdepth 1 -type f -name 'interest-growth-server-*.tar.gz' | sort)
            test "${#SERVER_ASSETS[@]}" -eq 1 || {
              echo "FAIL: expected exactly one server bundle, found ${#SERVER_ASSETS[@]}" >&2
              exit 1
            }
            cp "${SERVER_ASSETS[0]}" dist/release/
          else
            echo "RC asset contract: Android arm64 APK only; Stable-only desktop/server assets are NOT RUN."
          fi

          find dist/release -maxdepth 1 -type f -print
          for forbidden in 'x86_64' 'debug' 'release-test' '.pem' '.jks' '.keystore' 'raw-log'; do
            if find dist/release -maxdepth 1 -type f -iname "*${forbidden}*" | grep -q .; then
              echo "FAIL: forbidden release asset marker: ${forbidden}" >&2
              exit 1
            fi
          done
          test -s dist/release/interest-growth-android-arm64.apk
          cp dist/release/interest-growth-android-arm64.apk dist/sbom-input/
      - name: Generate candidate SBOM
        uses: anchore/sbom-action@main
        with:
          path: dist/sbom-input
          format: spdx-json
          output-file: dist/release/interest-growth-android-arm64.spdx.json
          upload-artifact: false
      - name: Generate release verification report from this gate run
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          REPORT="V${VERSION//./_}_RELEASE_VERIFICATION.md"
          STABLE="${{ needs.release-meta.outputs.is_stable }}"
          s() { if [ "${STABLE}" = "true" ]; then echo "$1=$2"; else echo "$1=NOT RUN (RC)"; fi; }
          REPORT_ARGS=()
          mapfile -d '' REPORT_ASSETS < <(find dist/release -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -print0 | sort -z)
          for asset in "${REPORT_ASSETS[@]}"; do REPORT_ARGS+=(--asset "${asset}"); done
          ST_EXTENDED="$(s "stable-exact-tag-extended" "${{ needs.stable-exact-tag-extended.result }}")"
          ST_UPGRADE="$(s "android-upgrade-in-place" "${{ needs.android-upgrade-in-place.result }}")"
          ST_CROSS="$(s "cross-device" "${{ needs.cross-device.result }}")"
          ST_WIN="$(s "windows-package" "${{ needs.windows-package.result }}")"
          ST_MAC="$(s "macos-package" "${{ needs.macos-package.result }}")"
          ST_DESK="$(s "desktop-package-audit" "${{ needs.desktop-package-audit.result }}")"
          ST_SERVER="$(s "server-bundle" "${{ needs.server-bundle.result }}")"
          ST_SERVER_DEPLOY="$(s "server-bundle-clean-deployment" "${{ needs.server-bundle-deployment.result }}")"
          python3 scripts/ci/generate_release_report.py \
            --out "dist/release/${REPORT}" \
            "${REPORT_ARGS[@]}" \
            --field "Node=22" --field "JDK=17" --field "Android SDK=36" --field "NDK=27.1" \
            --field "Android ABI (release)=arm64-v8a" --field "Android ABI (emulator)=x86_64" \
            --field "ReleaseKind=${{ needs.release-meta.outputs.is_candidate == 'true' && 'STABLE_CANDIDATE' || (needs.release-meta.outputs.is_stable == 'true' && 'STABLE' || 'RC') }}" \
            --test-result "repo-integrity=${{ needs.repo-integrity.result }}" \
            --test-result "python-host(3.12)=${{ needs.python-host.result }}" \
            --test-result "python-host(3.11)=${{ needs.python-3-11.result }}" \
            --test-result "web/ClientRuntime=${{ needs.web.result }}" \
            --test-result "rust=${{ needs.rust.result }}" \
            --test-result "docker-integration=${{ needs.docker-integration.result }}" \
            --test-result "security-dependency=${{ needs.security-dependency.result }}" \
            --test-result "android-signed-build=${{ needs.android-signed-build.result }}" \
            --test-result "android-emulator=${{ needs.android-emulator.result }}" \
            --test-result "android-ui-ipc-e2e=${{ needs.android-emulator.result }}" \
            --test-result "${ST_EXTENDED}" --test-result "${ST_UPGRADE}" \
            --test-result "${ST_CROSS}" --test-result "${ST_WIN}" \
            --test-result "${ST_MAC}" --test-result "${ST_DESK}" \
            --test-result "${ST_SERVER}" --test-result "${ST_SERVER_DEPLOY}" \
            --not-run "physical Android device" \
            --not-run "real public internet TLS (contract verified via Docker ephemeral HTTPS in CI)" \
            --not-run "Windows code-signing certificate (external-managed; build+smoke verified, not signed)" \
            --not-run "macOS Developer ID / notarization credentials (external-managed; build+smoke verified, not signed)"

          CHECKSUM_ASSETS=()
          mapfile -d '' CHECKSUM_ASSETS < <(find dist/release -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -print0 | sort -z)
          test "${#CHECKSUM_ASSETS[@]}" -gt 0
          python3 scripts/ci/generate_release_checksums.py \
            --out dist/release/SHA256SUMS.txt "${CHECKSUM_ASSETS[@]}"
      - name: Upload canonical release asset staging
        uses: actions/upload-artifact@v4 # v4
        with:
          name: formal-release-assets
          path: dist/release/*
          if-no-files-found: error
      - name: Canonical release asset audit passed
        run: 'echo "RELEASE ASSET ALLOWLIST + CANONICAL STAGING + CHECKSUM + SBOM: PASS"'

  # ===========================================================================

  release-gate:
    name: Release aggregate gate
    runs-on: ubuntu-latest
    needs:
      - release-meta
      - repo-integrity
      - python-host
      - python-3-11
      - web
      - rust
      - docker-integration
      - security-dependency
      - android-signed-build
      - android-emulator
      - stable-exact-tag-extended
      - android-upgrade-in-place
      - cross-device
      - windows-package
      - macos-package
      - desktop-package-audit
      - server-bundle
      - server-bundle-deployment
      - release-asset-allowlist
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1 # v7.0.1
      - name: All required gates green
        run: 'echo "release-gate: PASS (all required jobs succeeded)"'
