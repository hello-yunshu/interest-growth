name: Web E2E (UX closure)

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: web-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web-ux-closure:
    name: Gate R1 Web/UX closure
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Host verification dependencies (uvicorn + FastAPI + models)
        run: python -m pip install -e ".[dev]"

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Boot API + Web fixture (helper script)
        run: bash scripts/ci/web_e2e_server.sh start

      - name: Run Web/UX closure checks
        working-directory: apps/web
        env:
          E2E_API_URL: http://127.0.0.1:8000
          E2E_WEB_URL: http://127.0.0.1:3000
        run: npm run e2e:web

      - name: Tear down fixture
        if: always()
        run: bash scripts/ci/web_e2e_server.sh stop