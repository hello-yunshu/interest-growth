name: Stable Candidate

# This is the only pre-tag entry point for the full Stable-only matrix. It
# calls the reusable gate workflow used by tag-triggered final releases, with
# publishing disabled by mode. The exact SHA is validated against the caller's
# checkout and current origin/main before any gate runs.
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Exact origin/main SHA to validate"
        required: true
        type: string

permissions:
  contents: read

jobs:
  stable-gates:
    uses: ./.github/workflows/_release-gates.yml
    with:
      mode: candidate
      candidate_sha: ${{ inputs.candidate_sha }}
    secrets: inherit
