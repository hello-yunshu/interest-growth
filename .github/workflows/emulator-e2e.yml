name: Android Emulator Vertical Slice Verify

# Gate R2 §10.2 — dedicated, manual-trigger verification of the Android
# emulator real remote vertical slice on a clean GitHub-hosted runner. This
# exists so the slice can be iterated during release hardening WITHOUT
# triggering the Release workflow (which builds signed APKs and publishes a
# release). It builds the x86_64 DEBUG APK (no signing secrets), boots a
# self-hosted API server from the current commit, and drives the real native
# RemoteBroker end-to-end via adb reverse loopback.
#
# The debug-only trigger hook (emulator_e2e.rs) is `cfg(debug_assertions)`-
# gated and inert in release builds, so no auth bypass is exposed.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-emulator-vertical-slice:
    name: Android emulator real remote vertical slice (x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 17
        uses: actions/setup-java@2e5b3051ff9e70c6eeb4ea1d0f3c0eae77f8e0a4 # v5.0.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build Android toolchain image
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6
        with:
          context: .
          file: docker/android/Dockerfile
          platforms: linux/amd64
          load: true
          tags: interest-growth-android
          cache-from: type=gha,scope=android-toolchain
          cache-to: type=gha,mode=max,scope=android-toolchain
      - name: Build emulator x86_64 debug APK (no signing secrets)
        run: |
          docker run --rm --platform linux/amd64 \
            -v "$PWD":/work -w /work \
            -v ig-gradle-cache:/root/.gradle -v ig-cargo-home:/usr/local/cargo \
            -e ANDROID_HOME=/opt/android-sdk \
            -e ANDROID_NDK_HOME=/opt/android-sdk/ndk/27.1.12297006 \
            interest-growth-android bash -c 'cd apps/desktop && npm ci && npm run tauri -- android build --apk --target x86_64 --debug'
      - name: Stage x86_64 debug APK
        run: |
          mkdir -p dist/android
          X86="$(find apps/desktop/src-tauri/gen/android/app/build/outputs/apk -path '*/debug/*-debug.apk' -type f 2>/dev/null | head -1)"
          if [ -z "${X86}" ]; then echo "no x86_64 debug APK produced" >&2; exit 1; fi
          cp "${X86}" dist/android/interest-growth-android-x86_64-debug.apk
      - name: Install emulator system image + create AVD
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "system-images;android-35;google_apis;x86_64" "platform-tools" "emulator" >/dev/null
          echo "no" | avdmanager create avd -n igtest -k "system-images;android-35;google_apis;x86_64" --force
      - name: Boot self-hosted API server (docker, current commit)
        run: |
          set -euo pipefail
          docker compose -p ig-emulator build api
          PG_REMOTE_AUTH_ENABLED=true \
          PG_OWNER_BOOTSTRAP_TOKEN="ci-bootstrap-token-7a1f" \
          docker compose -p ig-emulator up -d api
          for _ in $(seq 1 60); do
            if curl -sS -o /dev/null http://127.0.0.1:8000/api/health; then
              echo "server healthy on 127.0.0.1:8000"
              exit 0
            fi
            sleep 2
          done
          echo "server failed to become healthy" >&2
          docker compose -p ig-emulator logs api >&2 || true
          exit 1
      - name: Boot emulator and run real remote vertical slice
        uses: reactivecircus/android-emulator-runner@cad321644df6d8cf1985a42767272ff068adb9cb # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          avd-name: igtest
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set -euo pipefail
            PKG=app.psychologygrowth.desktop
            adb install dist/android/interest-growth-android-x86_64-debug.apk
            # Map the host self-hosted API server (port 8000) onto the emulator
            # loopback at 127.0.0.1:18080 so the enrollment origin stays loopback.
            adb reverse tcp:18080 tcp:8000
            adb reverse --list
            # Inject the debug-only vertical-slice trigger config into the app-private files dir.
            cat > /tmp/ig_e2e.json <<'JSON'
            {"origin": "http://127.0.0.1:18080", "ownerPassword": "Ci-Owner-Password-2026!", "bootstrapToken": "ci-bootstrap-token-7a1f", "deviceName": "android-emulator-ci"}
            JSON
            adb push /tmp/ig_e2e.json /data/local/tmp/ig_e2e.json
            adb shell run-as ${PKG} sh -c 'mkdir -p files && cp /data/local/tmp/ig_e2e.json files/ig_e2e_config.json && chmod 600 files/ig_e2e_config.json'
            # Launch the app; debug setup spawns the debug-only vertical slice.
            adb shell am start -n ${PKG}/.MainActivity
            # Poll the result file (up to ~90s) written by the in-app slice.
            for _ in $(seq 1 45); do
              RESULT="$(adb shell run-as ${PKG} sh -c 'cat files/ig_e2e_result.json 2>/dev/null' 2>/dev/null || true)"
              if echo "$RESULT" | grep -q '"result": "PASS"'; then
                echo "emulator real remote vertical slice: PASS"
                echo "$RESULT"
                adb shell pidof ${PKG} || true
                exit 0
              fi
              if echo "$RESULT" | grep -q '"result": "FAIL"'; then
                echo "emulator real remote vertical slice: FAIL"
                echo "$RESULT"
                exit 1
              fi
              sleep 2
            done
            echo "FAIL: vertical slice did not complete in time" >&2
            adb shell run-as ${PKG} sh -c 'cat files/ig_e2e_result.json 2>/dev/null' 2>/dev/null || true
            exit 1