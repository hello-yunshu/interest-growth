name: CI

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  actionlint:
    name: Workflow syntax (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Run actionlint on all workflows
        # Pinned to a specific image digest (immutable, supply-chain hardening);
        # `:latest` is mutable and would let the lint tool change under the CI.
        uses: docker://rhysd/actionlint@sha256:9d36088643581e728c969f35141f88139fec77280b2be23c1f66f8e40e1025e7
        with:
          args: -color

  repo-integrity:
    name: Repository integrity gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify repository integrity (symlink/path/FileProvider/manifest scope)
        run: bash scripts/ci/verify_repo.sh
      - name: Verify third-party dependency versions are unchanged
        run: python scripts/release/verify_dependency_versions_unchanged.py --base-ref HEAD^

  host:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Host verification dependencies
        run: python -m pip install -e ".[dev]"
      - name: Audit public repository
        run: python scripts/audit_public_repo.py
      - name: Verify merged Host
        run: python scripts/verify.py
      - name: Verify Native Core single-source mirror
        run: python scripts/verify_native_core_sync.py
      - name: Run architectural self-audit
        run: python scripts/self_audit.py
      - name: Run strict Host cutover audit
        run: python scripts/audit_host_v050.py . --strict
      - name: Run scripts/ci unit tests (desktop binary resolver, §7/§8)
        run: python scripts/ci/test_resolve_desktop_app_binary.py -v

  native-core:
    name: Standalone Native Core
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install and verify standalone package
        working-directory: packages/native-execution-core
        run: |
          python -m pip install -e ".[dev,api]"
          python scripts/verify.py
      - name: Build standalone Wheel
        working-directory: packages/native-execution-core
        run: python -m pip wheel . --no-deps -w dist
      - name: Isolated Wheel smoke test
        working-directory: packages/native-execution-core
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/wheel-smoke"
          "$RUNNER_TEMP/wheel-smoke/bin/python" -m pip install --no-deps dist/*.whl
          "$RUNNER_TEMP/wheel-smoke/bin/python" -c "import interest_growth_native as package; assert package.__version__ == '0.6.0rc2'"

  exact-rag-upstreams:
    name: Reviewed exact RAG upstream APIs
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install + verify reviewed RAG APIs (shared path, §9)
        run: bash scripts/ci/verify_rag_upstreams.sh

  web:
    name: Web lint and static build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install Web dependencies
        working-directory: apps/web
        run: npm ci
      - name: Lint Web
        working-directory: apps/web
        run: npm run lint
      - name: Run ClientRuntime tests (contract + Android runtime + connect-controller)
        working-directory: apps/web
        run: node --test lib/runtime/test/*.test.mjs
      - name: Build static Web
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_BASE: http://localhost:8000/api
        run: npm run build

  rust:
    name: Rust source gate (cargo check/test --locked --lib)
    runs-on: ubuntu-latest
    # Tauri system deps + web export + cargo check/test (incl. the harness
    # feature check) needs headroom over the old 30m budget.
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1 (latest stable release)
        with:
          toolchain: stable
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install Tauri Linux system dependencies
        # Bounded apt with canonical mirror pinning — the default azure
        # mirror hangs intermittently; see scripts/ci/install_tauri_system_deps.sh.
        run: bash scripts/ci/install_tauri_system_deps.sh
      - name: Build web static export (required by tauri frontendDist)
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_BASE: http://localhost:8000/api
        run: |
          npm ci
          npm run build
      - name: Rust source gate (cargo check + test --locked --lib)
        run: bash scripts/ci/verify_rust.sh

  security-dependency:
    name: Dependency security (pip / npm / cargo)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Audit Python runtime dependencies
        run: |
          python -m pip install -e . pip-audit
          pip-audit --skip-editable
      - name: Audit optional RAG extras (documented dev-only advisory)
        # PYSEC-2026-113: pyarrow 22.0.0 is forced by graphrag~=3.1 (graphrag
        # pins pyarrow~=22.0). The optional RAG extra pins NLTK >=3.10.0 so
        # the current NLTK advisories cannot resolve into this audit. The
        # remaining pyarrow ignore is documented explicitly and auditable.
        run: |
          python -m pip install -e ".[rag-graphrag]" pip-audit
          pip-audit --skip-editable --ignore-vuln PYSEC-2026-113
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Audit production npm dependencies
        working-directory: apps/web
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - name: Install cargo-audit
        uses: taiki-e/install-action@c93ccc03e00cd0e08e494f5fd058a6c55a6a1907
        with:
          tool: cargo-audit
      - name: Audit Rust dependencies (high-confidence advisories)
        working-directory: apps/desktop/src-tauri
        run: cargo audit

  # Gate D §17 — stable aggregate name for branch protection.
  # main requires THIS single job instead of each individual job name, so a
  # future job rename does not silently weaken the protected-branch status
  # checks. It is red if any critical PR gate is red.
  pr-required-gate:
    name: PR Required Gate (aggregate of all critical PR checks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: always()
    needs:
      - actionlint
      - repo-integrity
      - host
      - native-core
      - exact-rag-upstreams
      - web
      - rust
      - security-dependency
    steps:
      - name: Enforce aggregate success
        shell: bash
        run: |
          actionlint="${{ needs.actionlint.result }}"
          repo_integrity="${{ needs.repo-integrity.result }}"
          host="${{ needs.host.result }}"
          native_core="${{ needs.native-core.result }}"
          exact_rag="${{ needs.exact-rag-upstreams.result }}"
          web="${{ needs.web.result }}"
          rust="${{ needs.rust.result }}"
          security_dependency="${{ needs.security-dependency.result }}"
          failed=""
          for pair in \
              "actionlint" "repo-integrity" "host" "native-core" \
              "exact-rag-upstreams" "web" "rust" "security-dependency"; do
            case "$pair" in
              actionlint) r="$actionlint" ;;
              repo-integrity) r="$repo_integrity" ;;
              host) r="$host" ;;
              native-core) r="$native_core" ;;
              exact-rag-upstreams) r="$exact_rag" ;;
              web) r="$web" ;;
              rust) r="$rust" ;;
              security-dependency) r="$security_dependency" ;;
            esac
            if [ "$r" != "success" ]; then failed="${failed} ${pair}=${r}"; fi
          done
          if [ -n "$failed" ]; then
            echo "PR Required Gate FAIL: one or more critical jobs did not succeed:" >&2
            echo "$failed" >&2
            exit 1
          fi
          echo "PR Required Gate: PASS (all critical jobs succeeded)"
