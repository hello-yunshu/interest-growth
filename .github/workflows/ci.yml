name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and verification dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev,api]"

      - name: Audit public repository
        run: python scripts/audit_public_repo.py

      - name: Verify RC2 invariants
        run: python scripts/verify.py

      - name: Build Wheel
        run: python -m pip wheel . --no-deps -w dist

      - name: Isolated Wheel smoke test
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/wheel-smoke"
          "$RUNNER_TEMP/wheel-smoke/bin/python" -m pip install --no-deps dist/*.whl
          "$RUNNER_TEMP/wheel-smoke/bin/python" -c "import interest_growth_native as package; assert package.__version__ == '0.6.0rc2'"
