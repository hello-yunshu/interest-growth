name: Desktop Build

on:
  workflow_dispatch:
  push:
    tags: ["desktop-v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: '3.13' }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with: { node-version: '22' }
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1 (latest stable release)
        with: { targets: '${{ matrix.target }}' }
      - name: Install Python build dependencies
        run: python -m pip install -e ".[desktop]"
      - name: Install web dependencies
        run: npm ci --prefix apps/web
      - name: Install desktop CLI
        run: npm ci --prefix apps/desktop
      - name: Test core
        run: python -m pytest
      - name: Build Python sidecar
        run: python scripts/build_desktop_sidecar.py --target ${{ matrix.target }}
      - name: Smoke packaged Python sidecar
        run: python scripts/smoke_desktop_sidecar.py --target ${{ matrix.target }}
      - name: Self-audit source boundaries
        run: python scripts/self_audit.py
      - name: Build web static export
        run: npm --prefix apps/web run build
      - name: Build desktop bundle
        run: npm --prefix apps/desktop run build -- --target ${{ matrix.target }}
      - name: Upload unsigned build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: interest-growth-${{ matrix.target }}-unsigned
          path: apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**
          if-no-files-found: error
